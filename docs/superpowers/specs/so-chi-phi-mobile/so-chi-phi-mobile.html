<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Sổ chi phí — Viomni Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Viomni "Orbit" — iOS 17/18 Human Interface Guidelines */
  :root{
    color-scheme:light dark;
    --bg:#F2F4F7; --card:#FFFFFF;
    --ink:#0B1A33; --ink-2:#3A4760; --muted:#56637A;
    --line:#E3E8EF; --divider:#E8ECF1;
    --track:#E6EAF0; --control:#C9D2DE; --sel-line:#D3DAE4;
    --primary:#0A7D76; --primary-soft:#E0F5F2; --primary-ink:#075E59;
    --amber:#7A4F00; --amber-soft:#FFF1CC;
    --ok:#0B7A55; --ok-soft:#E3F6EE;
    --danger:#B42318; --danger-soft:#FDE8E6;
    --nav-bg:rgba(242,244,247,.84);
    --card-shadow:0 1px 2px rgba(11,26,51,.04),0 0 0 .5px rgba(11,26,51,.06);
    --font:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0A111D; --card:#152238;
      --ink:#E7EDF6; --ink-2:#BAC5D6; --muted:#93A1B7;
      --line:#22324B; --divider:#22324B;
      --track:#1E2C43; --control:#3A4D6A; --sel-line:#3A4D6A;
      --primary:#3CC3B8; --primary-soft:#0F3236; --primary-ink:#8BE6DE;
      --amber:#F0B254; --amber-soft:#33280F;
      --ok:#34D399; --ok-soft:#0D2E24;
      --danger:#FF7A70; --danger-soft:#3A1715;
      --nav-bg:rgba(10,17,29,.82);
      --card-shadow:0 1px 3px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.07);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A111D; --card:#152238;
    --ink:#E7EDF6; --ink-2:#BAC5D6; --muted:#93A1B7;
    --line:#22324B; --divider:#22324B;
    --track:#1E2C43; --control:#3A4D6A; --sel-line:#3A4D6A;
    --primary:#3CC3B8; --primary-soft:#0F3236; --primary-ink:#8BE6DE;
    --amber:#F0B254; --amber-soft:#33280F;
    --ok:#34D399; --ok-soft:#0D2E24;
    --danger:#FF7A70; --danger-soft:#3A1715;
    --nav-bg:rgba(10,17,29,.82);
    --card-shadow:0 1px 3px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#DCE2EC;color:var(--ink);font:400 15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
  button{cursor:pointer;user-select:none;touch-action:manipulation}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  [hidden]{display:none!important}
  .num{font-variant-numeric:tabular-nums}
  .ic{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .ic.s{width:16px;height:16px;stroke-width:2}

  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 12px 28px;gap:12px}
  .phone{
    width:393px;height:852px;max-width:100%;
    background:var(--bg);border-radius:48px;
    box-shadow:0 24px 60px rgba(11,26,51,.22),0 0 0 10px #151C28,0 0 0 11.5px rgba(255,255,255,.14);
    position:relative;overflow:hidden;display:flex;flex-direction:column;
  }
  @media (max-width:440px){
    html,body{background:var(--bg)}
    .stage{padding:0;gap:0}
    .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
    .sbar,.home,.demo-bar{display:none!important}
    .nav{height:52px!important;padding-top:6px!important}
  }

  /* iOS Status bar & Dynamic Island */
  .sbar{
    height:46px;padding:14px 26px 0;
    display:flex;align-items:center;justify-content:space-between;
    font-size:14px;font-weight:600;letter-spacing:-.01em;
    position:absolute;top:0;left:0;right:0;z-index:25;pointer-events:none;
  }
  .island{width:118px;height:32px;background:#070B12;border-radius:20px;position:absolute;left:50%;top:10px;transform:translateX(-50%)}
  .sbar-r{display:flex;align-items:center;gap:6px}

  /* iOS Navigation bar */
  .nav{
    height:92px;padding:46px 10px 0;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--nav-bg);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid transparent;transition:border-color .18s;
    position:relative;z-index:10;flex-shrink:0;
  }
  .nav.pinned{border-bottom-color:var(--line)}
  .nav-title{font-size:17px;font-weight:600;letter-spacing:-.02em;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
  .nav-r{display:flex;align-items:center;gap:1px}
  .tap{
    min-width:38px;height:38px;padding:0 7px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;gap:2px;
    color:var(--primary);font-size:16px;font-weight:500;
    transition:transform .12s,background .12s,color .12s;
  }
  .tap:active{transform:scale(.94);background:var(--primary-soft)}
  .tap.on{background:var(--primary-soft);color:var(--primary-ink)}

  /* Inline collapsible search bar */
  .search-wrap{
    overflow:hidden;max-height:0;opacity:0;
    transition:max-height .26s var(--ease),opacity .2s,padding .26s var(--ease);
    padding:0 16px;
  }
  .search-wrap.on{max-height:54px;opacity:1;padding:2px 16px 10px}
  .search-box{
    height:36px;border-radius:10px;background:var(--track);
    display:flex;align-items:center;gap:8px;padding:0 10px;
    color:var(--muted);
  }
  .search-box input{
    flex:1;min-width:0;font-size:13.5px;color:var(--ink);
  }
  .search-box input::placeholder{color:var(--muted)}
  .search-clear{
    width:18px;height:18px;border-radius:50%;background:var(--control);color:var(--card);
    display:inline-flex;align-items:center;justify-content:center;
  }
  .search-clear .ic{width:11px;height:11px;stroke-width:2.5}

  /* Scrollable content */
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0 36px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  /* iOS Segmented Month Picker + All Months Icon */
  .seg-row{margin:0 16px 10px;display:flex;align-items:center;gap:6px}
  .seg{
    flex:1;padding:3px;background:var(--track);border-radius:10px;
    display:grid;grid-template-columns:repeat(3,1fr);position:relative;
  }
  .seg-ind{
    position:absolute;top:3px;bottom:3px;left:3px;
    width:calc((100% - 6px)/3);
    background:var(--card);border:.5px solid var(--sel-line);border-radius:8px;
    box-shadow:0 1px 2px rgba(11,26,51,.08);
    transition:transform .26s var(--ease);
  }
  .seg button{
    position:relative;z-index:1;height:30px;font-size:13px;font-weight:500;
    color:var(--muted);border-radius:8px;transition:color .18s;
  }
  .seg button.on{color:var(--ink);font-weight:600}
  .seg-more{
    width:36px;height:36px;border-radius:10px;background:var(--track);
    color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:transform .12s,background .15s;
  }
  .seg-more:active{transform:scale(.94)}
  .seg-more.on{background:var(--primary-soft);color:var(--primary)}

  /* Tầng 1: Tóm tắt tháng */
  .sum{
    margin:0 16px 12px;padding:15px 16px 14px;
    background:var(--card);border-radius:16px;box-shadow:var(--card-shadow);
  }
  .sum-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .sum-l{font-size:12.5px;font-weight:500;color:var(--muted)}
  .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.08;margin-top:4px}
  .big small{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px}
  .sum-actions{display:flex;align-items:center;gap:6px}
  .delta-pill{
    font-size:11.5px;font-weight:600;color:var(--muted);
    background:var(--bg);padding:4px 8px;border-radius:99px;
    white-space:nowrap;
  }
  .delta-pill.down{color:var(--ok);background:var(--ok-soft)}
  .delta-pill.up{color:var(--amber);background:var(--amber-soft)}
  .icon-pill{
    width:30px;height:30px;border-radius:9px;background:var(--bg);
    color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;
    transition:transform .12s,background .15s,color .15s;
  }
  .icon-pill:active{transform:scale(.92)}
  .icon-pill.on{background:var(--primary-soft);color:var(--primary)}
  .meter{height:6px;border-radius:99px;background:var(--amber-soft);overflow:hidden;margin:13px 0 10px}
  .meter>span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .32s var(--ease)}
  .pair{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);gap:8px}
  .pair-btn{
    display:inline-flex;align-items:center;gap:5px;padding:4px 8px;margin:-4px -8px;
    border-radius:8px;color:var(--muted);transition:background .15s,color .15s;
  }
  .pair-btn:active{background:var(--bg)}
  .pair-btn.on{background:var(--primary-soft);color:var(--primary-ink)}
  .pair-btn strong{color:var(--ink);font-weight:600;font-size:14px}
  .pair-btn.owe strong{color:var(--amber)}
  .pair-btn.on strong{color:var(--primary-ink)}

  /* Bảng tỷ trọng theo nhóm (mở gọn ngay trong thẻ Tổng chi) */
  .grp-panel{
    margin-top:12px;padding-top:12px;border-top:.5px solid var(--divider);
    display:flex;flex-direction:column;gap:7px;
  }
  .grp-row{
    display:flex;align-items:center;gap:9px;padding:5px 6px;margin:0 -6px;
    border-radius:8px;font-size:12.5px;text-align:left;transition:background .14s;
  }
  .grp-row:active{background:var(--bg)}
  .grp-row.on{background:var(--primary-soft)}
  .grp-name{width:118px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp-row.on .grp-name{color:var(--primary-ink);font-weight:600}
  .grp-bar{flex:1;height:5px;border-radius:99px;background:var(--track);overflow:hidden}
  .grp-bar>span{display:block;height:100%;border-radius:99px}
  .grp-val{font-size:12px;font-weight:600;color:var(--ink);min-width:74px;text-align:right}
  .grp-pct{font-size:11px;color:var(--muted);width:28px;text-align:right}

  /* Tầng 2: 5 Khoản cố định hàng tháng */
  .rc{margin:0 16px 12px;background:var(--card);border-radius:16px;box-shadow:var(--card-shadow);overflow:hidden}
  .rc-h{
    width:100%;min-height:52px;padding:10px 14px;
    display:flex;align-items:center;gap:10px;text-align:left;
  }
  .rc-h:active{background:rgba(11,26,51,.03)}
  .rc-dots{display:flex;align-items:center;flex-shrink:0}
  .rc-dots i{
    width:10px;height:10px;border-radius:50%;background:var(--c);
    box-shadow:0 0 0 2px var(--card);
  }
  .rc-dots i+i{margin-left:-3px}
  .rc-m{flex:1;min-width:0}
  .rc-t{font-size:13.5px;font-weight:600}
  .rc-s{font-size:12px;color:var(--muted);margin-top:1px}
  .pill{
    height:30px;padding:0 11px;border-radius:99px;
    border:1.25px solid var(--primary);color:var(--primary);
    font-size:12.5px;font-weight:600;flex-shrink:0;
    display:inline-flex;align-items:center;gap:4px;
    transition:transform .12s,background .12s;
  }
  .pill:active{transform:scale(.96);background:var(--primary-soft)}
  .chev{color:var(--muted);transition:transform .24s var(--ease)}
  .rc.open .chev{transform:rotate(180deg)}
  .rc-b{border-top:.5px solid var(--divider);padding:2px 14px 12px;display:none}
  .rc.open .rc-b{display:block}
  .rc-it{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 0}
  .rc-it+.rc-it{border-top:.5px solid var(--divider)}
  .rc-ck{
    width:24px;height:24px;border-radius:50%;
    border:1.6px solid var(--control);
    display:inline-flex;align-items:center;justify-content:center;
    color:#fff;flex-shrink:0;transition:all .14s;
  }
  .rc-ck.on{background:var(--primary);border-color:var(--primary)}
  .rc-it-m{flex:1;min-width:0}
  .rc-it-t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc-it.off .rc-it-t{color:var(--muted);text-decoration:line-through}
  .rc-amt{
    font-size:13.5px;font-weight:600;padding:5px 9px;border-radius:8px;
    background:var(--bg);display:inline-flex;align-items:center;gap:5px;
  }
  .rc-amt:active{background:var(--primary-soft);color:var(--primary-ink)}
  .rc-cta{
    width:100%;height:40px;margin-top:8px;border-radius:10px;
    background:var(--primary);color:#fff;font-size:13.5px;font-weight:600;
    transition:opacity .15s,transform .12s;
  }
  .rc-cta:active{transform:scale(.99)}
  .rc-cta:disabled{opacity:.4;pointer-events:none}

  /* Thanh báo đang lọc / sắp xếp */
  .active-filter{
    margin:0 16px 8px;display:flex;align-items:center;justify-content:space-between;
    padding:6px 11px;border-radius:10px;background:var(--primary-soft);color:var(--primary-ink);
    font-size:12px;font-weight:600;gap:8px;
  }
  .active-filter button{
    display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--primary);flex-shrink:0;
  }

  /* Tầng 3: Danh sách chi phí */
  .dhead{
    padding:10px 20px 5px;
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;font-weight:600;color:var(--muted);
  }
  .list{margin:0 16px 6px;background:var(--card);border-radius:14px;box-shadow:var(--card-shadow);overflow:hidden}
  .row-w{position:relative;overflow:hidden}
  .row-w+.row-w::before{
    content:"";position:absolute;top:0;left:36px;right:0;height:.5px;
    background:var(--divider);z-index:2;pointer-events:none;
  }
  .sw-bg{
    position:absolute;inset:0;display:flex;align-items:stretch;justify-content:space-between;
    pointer-events:none;opacity:0;transition:opacity .15s;
  }
  .row-w.swiping .sw-bg,.row-w.sw-open .sw-bg{opacity:1;pointer-events:auto}
  .sw-l,.sw-r{display:flex;align-items:stretch}
  .sw-act{
    width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:#fff;font-size:11px;font-weight:600;
  }
  .sw-act.pay{background:var(--ok)}
  .sw-act.dup{background:var(--primary)}
  .sw-act.del{background:var(--danger)}
  .row{
    width:100%;min-height:58px;padding:9px 16px;
    display:flex;align-items:center;gap:11px;text-align:left;
    position:relative;z-index:1;background:var(--card);
    transition:transform .26s var(--ease),background .12s;
    touch-action:pan-y;
  }
  .row:active{background:rgba(11,26,51,.035)}
  .row.flash{animation:flash 1.1s ease-out}
  @keyframes flash{0%{background:var(--primary-soft)}100%{background:var(--card)}}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex-shrink:0}
  .rm{flex:1;min-width:0}
  .rt{font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .rs{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clip-tag{
    display:inline-flex;align-items:center;gap:2px;
    color:var(--primary);font-weight:600;font-size:11px;flex-shrink:0;
  }
  .clip-tag .ic{width:11px;height:11px;stroke-width:2.2}
  .rr{text-align:right;flex-shrink:0}
  .amt{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .st{font-size:11.5px;margin-top:2px;display:inline-flex;align-items:center;justify-content:flex-end;gap:4px}
  .st.paid{color:var(--ok)}
  .st.part{color:var(--amber);font-weight:500}
  .st.unpaid{color:var(--amber);font-weight:500}
  .st.unpaid::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber)}

  .empty{
    margin:8px 16px;padding:34px 20px;text-align:center;
    background:var(--card);border-radius:16px;box-shadow:var(--card-shadow);
  }
  .empty-t{font-size:14.5px;font-weight:600;margin-bottom:3px}
  .empty-s{font-size:12.5px;color:var(--muted);margin-bottom:14px}

  /* Toast hoàn tác */
  .toast{
    position:absolute;left:16px;right:16px;bottom:24px;z-index:55;
    padding:11px 14px;border-radius:12px;
    background:rgba(11,26,51,.92);color:#fff;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:13px;font-weight:500;
    box-shadow:0 10px 26px rgba(11,26,51,.26);
    opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .2s,transform .22s var(--ease);
  }
  .toast.on{opacity:1;transform:translateY(0);pointer-events:auto}
  .toast button{color:#5EEAD4;font-weight:700;padding:3px 6px;border-radius:6px}

  /* Long-press iOS Context Menu */
  .ctx-scrim{
    position:absolute;inset:0;z-index:45;
    background:rgba(11,26,51,.28);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .18s;
  }
  .ctx-scrim.on{opacity:1;pointer-events:auto}
  .ctx{
    position:absolute;left:16px;right:16px;z-index:46;
    opacity:0;transform:scale(.94);pointer-events:none;
    transition:opacity .18s,transform .22s var(--ease);
  }
  .ctx.on{opacity:1;transform:scale(1);pointer-events:auto}
  .ctx-row{background:var(--card);border-radius:14px;box-shadow:0 12px 32px rgba(11,26,51,.22);overflow:hidden}
  .ctx-menu{
    margin-top:8px;width:236px;margin-left:auto;
    background:var(--card);border-radius:14px;
    box-shadow:0 14px 36px rgba(11,26,51,.25);overflow:hidden;
  }
  .ctx-menu button{
    width:100%;height:44px;padding:0 14px;
    display:flex;align-items:center;justify-content:space-between;
    font-size:14px;font-weight:500;
  }
  .ctx-menu button+button{border-top:.5px solid var(--divider)}
  .ctx-menu button:active{background:var(--bg)}
  .ctx-menu .danger{color:var(--danger)}

  /* Bottom Sheet — iOS Custom Detents */
  .scrim{
    position:absolute;inset:0;z-index:30;background:rgba(11,26,51,.36);
    opacity:0;pointer-events:none;transition:opacity .26s;
  }
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:0;right:0;top:54px;bottom:0;z-index:31;
    background:var(--bg);border-radius:16px 16px 0 0;
    box-shadow:0 -8px 32px rgba(11,26,51,.2);
    display:flex;flex-direction:column;
    transform:translateY(105%);transition:transform .34s var(--ease);
    touch-action:none;
  }
  .sheet.dragging{transition:none}
  .grab{padding:8px 0 4px;display:flex;justify-content:center;cursor:grab;flex-shrink:0}
  .grab i{width:36px;height:5px;border-radius:99px;background:var(--control)}
  .sh-bar{
    min-height:42px;padding:2px 14px 6px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;
  }
  .sh-title{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .sh-actions{display:flex;align-items:center;gap:6px}
  .xbtn{
    width:30px;height:30px;border-radius:50%;background:var(--track);
    color:var(--muted);display:inline-flex;align-items:center;justify-content:center;
    transition:transform .12s,background .15s,color .15s;
  }
  .xbtn:active{transform:scale(.92)}
  .xbtn.danger{color:var(--danger);background:var(--danger-soft)}
  .sh-body{flex:1;overflow-y:auto;padding:2px 16px 28px;touch-action:pan-y}

  /* Sheet Chi tiết (gọn gàng, tinh tế chuẩn iOS) */
  .hero{padding:2px 2px 10px}
  .t-edit{

  .pad-hint.up{color:var(--amber)}
  .pad-hint.down{color:var(--ok)}

  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
  .key{
    height:46px;border-radius:10px;background:var(--card);

  .key:active{transform:scale(.95);background:var(--track)}

  .key.done{background:var(--primary);color:#fff;font-size:15px;font-weight:600}
  .key.done:disabled{opacity:.4;pointer-events:none}

  .home{
    width:134px;height:5px;border-radius:99px;background:var(--ink);opacity:.22;

</style>

    "Lương kế toán dịch vụ": [["T8",3000000],["T9",3000000],["T10",3000000]],

    "Phí hosting":           [["T8",2450000],["T9",2450000],["T10",2450000]]

  /* Phân tích chuỗi tiền Việt để tìm kiếm theo số tiền (vd: 450k, 2.45tr, 2tr45, 2.450.000, 2450000) */
  function parseQueryAmount(q){
    var s=q.trim().toLowerCase().replace(/\s+/g,"");
    var m1=s.match(/^(\d+(?:[.,]\d+)?)(tr|triệu|trieu|m|k|nghìn|ngàn|đ|d)$/);
    if(m1){
      var n=parseFloat(m1[1].replace(",",".")), u=m1[2];
      if(u==="tr"||u==="triệu"||u==="trieu"||u==="m") return Math.round(n*1e6);
      if(u==="k"||u==="nghìn"||u==="ngàn") return Math.round(n*1e3);
      return Math.round(n);
    }
    var m2=s.match(/^(\d+)(tr|m)(\d+)$/);
    if(m2){
      var frac=m2[3].padEnd(6,"0").slice(0,6);
      return parseInt(m2[1],10)*1e6+parseInt(frac,10);
    }
    var digits=s.replace(/[.,đd]/g,"");
    if(/^\d{4,}$/.test(digits)) return parseInt(digits,10);
    return null;
  }

  function matchExpense(i,rawQ){
    if(!rawQ)return true;
    var q=rawQ.toLowerCase().trim();
    var g=G[i.g]||G.op;
    var lastPaid=i.pays&&i.pays.length?i.pays[i.pays.length-1].d:"";
    var fileNames=(i.files||[]).map(function(f){return f.name}).join(" ");
    var hay=(i.t+" "+g.n+" "+(i.acc||"")+" "+i.d+" "+(i.at||"")+" "+lastPaid+" "+fileNames+" "+vnd(i.amt)+" "+i.amt).toLowerCase();
    if(hay.indexOf(q)>=0)return true;
    var qAmt=parseQueryAmount(q);
    if(qAmt!==null){
      var left=Math.max(0,i.amt-i.paid);
      if(i.amt===qAmt||i.paid===qAmt||left===qAmt)return true;
      if((i.pays||[]).some(function(p){return p.a===qAmt}))return true;
    }
    var cleanDigits=q.replace(/[.,\s]/g,"");
    if(/^\d{2,}$/.test(cleanDigits)&&String(i.amt).indexOf(cleanDigits)>=0)return true;
    return false;
  }

    renderGroupPanel(items,tot);
    renderRecur();
    renderList();
  }

  function renderList(){
    var wrap=$("listWrap"), all=S.items[S.m]||[];
    var fltParts=[];
    if(S.fltStatus==="paid") fltParts.push("Đã trả đủ");
    if(S.fltStatus==="owe") fltParts.push("Chưa trả xong");
    if(S.fltGroup) fltParts.push(G[S.fltGroup].n);

      var sObj=SORTS.find(function(x){return x.k===S.sortBy});

    }
    if(fltParts.length){
      $("activeFilter").hidden=false;
      $("filterLabel").textContent=fltParts.join(" · ");

    var items=all.filter(function(i){
      if(S.fltStatus==="paid"&&i.paid<i.amt)return false;
      if(S.fltStatus==="owe"&&i.paid>=i.amt)return false;
      if(S.fltGroup&&i.g!==S.fltGroup)return false;
      return matchExpense(i,S.q);
    });

    if(!items.length){
      wrap.innerHTML='<div class="empty">'
        +'<div class="empty-t">'+(all.length?'Không có khoản khớp tìm kiếm':'Tháng '+mNum(S.m)+' chưa có chi phí')+'</div>'

      return;
    }

    var yr=S.m.split("/")[1], today=todayFor(S.m);

    if(S.sortBy==="group"){
      var byG={}, gOrder=[];
      items.forEach(function(i){if(!byG[i.g]){byG[i.g]=[];gOrder.push(i.g)}byG[i.g].push(i)});
      gOrder.sort(function(a,b){
        var sa=byG[a].reduce(function(s,x){return s+x.amt},0);

          +'<div class="list">'+arr.map(rowHTML).join("")+'</div>';
      }).join("");
      S.flash={};
      return;
    }

    if(S.sortBy==="amt_desc"||S.sortBy==="amt_asc"){
      var sorted=items.slice().sort(function(a,b){return S.sortBy==="amt_desc"?b.amt-a.amt:a.amt-b.amt});
      var totS=sorted.reduce(function(s,x){return s+x.amt},0);
      var hdr=S.sortBy==="amt_desc"?"Số tiền cao → thấp":"Số tiền thấp → cao";
      wrap.innerHTML='<div class="dhead num"><span>'+hdr+' ('+sorted.length+' khoản)</span><span>'+vnd(totS)+' đ</span></div>'
        +'<div class="list">'+sorted.map(rowHTML).join("")+'</div>';
      S.flash={};
      return;
    }

    if(S.sortBy==="created_desc"){
      var byAt=items.slice().sort(function(a,b){return String(b.at||b.d).localeCompare(String(a.at||a.d))});
      var orderAt=[], mapAt={};
      byAt.forEach(function(i){
        var d=(i.at||i.d).split(" ")[0];
        if(!mapAt[d]){mapAt[d]=[];orderAt.push(d)}
        mapAt[d].push(i);
      });
      wrap.innerHTML=orderAt.map(function(d){
        var arr=mapAt[d], dSum=arr.reduce(function(s,x){return s+x.amt},0);
        return '<div class="dhead num"><span>Ngày nhập · '+d+'/'+yr+'</span><span>'+vnd(dSum)+' đ</span></div>'
          +'<div class="list">'+arr.map(rowHTML).join("")+'</div>';
      }).join("");
      S.flash={};
      return;
    }

    if(S.sortBy==="paid_desc"){
      var orderP=[], mapP={};
      items.forEach(function(i){
        var pd=i.pays&&i.pays.length?i.pays[i.pays.length-1].d:"Chưa thanh toán";
        if(!mapP[pd]){mapP[pd]=[];orderP.push(pd)}
        mapP[pd].push(i);
      });
      wrap.innerHTML=orderP.map(function(pd){
        var arr=mapP[pd], dSum=arr.reduce(function(s,x){return s+x.amt},0);
        var lbl=pd==="Chưa thanh toán"?pd:"Ngày thanh toán · "+pd+"/"+yr;
        return '<div class="dhead num"><span>'+lbl+'</span><span>'+vnd(dSum)+' đ</span></div>'
          +'<div class="list">'+arr.map(rowHTML).join("")+'</div>';
      }).join("");
      S.flash={};
      return;
    }

    var order=[],byD={};
    items.forEach(function(i){if(!byD[i.d]){byD[i.d]=[];order.push(i.d)}byD[i.d].push(i)});
    wrap.innerHTML=order.map(function(d){
      var arr=byD[d], dSum=arr.reduce(function(s,x){return s+x.amt},0);
      var lbl=(d===today&&S.m==="11/2026"?"Hôm nay · ":"")+d+"/"+yr;
      return '<div class="dhead num"><span>'+lbl+'</span><span>'+vnd(dSum)+' đ</span></div>'
        +'<div class="list">'+arr.map(rowHTML).join("")+'</div>';
    }).join("");
    S.flash={};
  }

  /* Tương tác dòng */
  var lpT=null,lpFired=false,swState=null;
  function closeAllSwipes(exceptW){
    document.querySelectorAll(".row-w.sw-open").forEach(function(w){
      if(w===exceptW)return;
      w.classList.remove("sw-open");
      var r=w.querySelector(".row");if(r)r.style.transform="";
    });
  }

  $("listWrap").addEventListener("click",function(e){
    var swBtn=e.target.closest("[data-sw]");
    if(swBtn){
      var id=+swBtn.dataset.id, act=swBtn.dataset.sw;
      closeAllSwipes();
      if(act==="pay") payFull(id);
      else if(act==="dup") dupNext(id);
      else if(act==="del") delItem(id);
      return;
    }
    var r=e.target.closest(".row");
    if(!r||lpFired)return;
    var w=r.parentElement;
    if(w.classList.contains("sw-open")){closeAllSwipes();return;}
    closeAllSwipes();
    openDetail(+r.dataset.id);
  });

  $("listWrap").addEventListener("pointerdown",function(e){
    if(e.target.closest("[data-sw]"))return;
    var r=e.target.closest(".row");if(!r)return;
    var w=r.parentElement, id=+r.dataset.id;
    closeAllSwipes(w);
    lpFired=false;
    var sx=e.clientX, sy=e.clientY;
    var base=w.classList.contains("sw-open")?(parseFloat(r.dataset.tx)||0):0;
    swState={r:r,w:w,id:id,sx:sx,sy:sy,base:base,moved:false,horiz:null};
    clearTimeout(lpT);
    lpT=setTimeout(function(){
      if(!swState||swState.moved)return;
      lpFired=true;openCtx(id,r);
    },460);
  });

  window.addEventListener("pointermove",function(e){
    if(!swState)return;
    var dx=e.clientX-swState.sx, dy=e.clientY-swState.sy;
    if(!swState.moved&&(Math.abs(dx)>7||Math.abs(dy)>7)){
      swState.moved=true;clearTimeout(lpT);
      swState.horiz=Math.abs(dx)>Math.abs(dy);
      if(swState.horiz) swState.w.classList.add("swiping");
    }
    if(swState.horiz){
      var f=find(swState.id), hasPay=f&&(f.i.amt>f.i.paid);
      var tx=swState.base+dx;
      var maxL=hasPay?72:0, maxR=-132;
      if(tx>maxL) tx=maxL+(tx-maxL)*.2;
      if(tx<maxR) tx=maxR+(tx-maxR)*.2;
      swState.tx=tx;
      swState.r.style.transition="none";
      swState.r.style.transform="translateX("+tx+"px)";
    }
  });

  function endPtr(){
    clearTimeout(lpT);
    if(!swState)return;
    var st=swState;swState=null;
    st.w.classList.remove("swiping");
    st.r.style.transition="";
    if(st.horiz){
      var tx=st.tx||0, f=find(st.id), hasPay=f&&(f.i.amt>f.i.paid);
      if(hasPay&&tx>56){
        st.r.style.transform="";st.r.dataset.tx=0;st.w.classList.remove("sw-open");
        payFull(st.id);return;
      }
      if(tx<-46){
        st.r.style.transform="translateX(-128px)";st.r.dataset.tx=-128;
        st.w.classList.add("sw-open");
      }else{
        st.r.style.transform="";st.r.dataset.tx=0;
        st.w.classList.remove("sw-open");
      }
      lpFired=true;setTimeout(function(){lpFired=false},60);
    }
  }
  window.addEventListener("pointerup",endPtr);
  window.addEventListener("pointercancel",endPtr);

      acts.push({k:"full",l:"Đánh dấu Đã trả đủ",ic:"i-check"});

    acts.push({k:"amt",l:"Sửa số tiền…",ic:"i-edit"});

        +'<span>'+a.l+'</span><svg class="ic s"><use href="#'+a.ic+'"/></svg></button>';

      else if(k==="part")payPad(id);

  /* Nghiệp vụ thanh toán / đính kèm / nhân bản / xoá */
  var fileTargetId=null, fileDraftCb=null;
  $("hiddenFileInput").onchange=function(){
    var fls=Array.from(this.files||[]);
    this.value="";
    if(!fls.length)return;

      fileDraftCb(fls);fileDraftCb=null;return;
    }

        save();

          f.i.files.push({id:"f"+(++S.seq),name:file.name,size:Math.max(1,Math.round(file.size/1024))+" KB"});
        });

        toast("Đã đính kèm "+fls.length+" chứng từ",true);

      fileTargetId=null;

    fileTargetId=id;fileDraftCb=null;

  }

  function pay(id,amount,accName){
    var f=find(id);if(!f)return;
    var i=f.i, left=Math.max(0,i.amt-i.paid), a=Math.min(left,Math.max(0,Math.round(amount)));
    if(!a)return;
    save();
    var usedAcc=accName||i.acc||"TK ngân hàng";
    i.paid+=a;i.acc=usedAcc;
    i.pays.push({d:todayFor(f.m),a:a,acc:usedAcc});
    S.flash[id]=1;
    render();refreshDetail(id);
    toast(i.paid>=i.amt?"Đã trả đủ · "+i.t:"Đã trả "+vnd(a)+" đ · còn "+vnd(i.amt-i.paid)+" đ",true);
  }
  function payFull(id){var f=find(id);if(f)pay(id,f.i.amt-f.i.paid,f.i.acc)}
  function dupNext(id){
    var f=find(id);if(!f)return;
    save();
    var p=f.m.split("/"), mn=+p[0], yr=+p[1];
    var nm=mn===12?"01/"+(yr+1):String(mn+1).padStart(2,"0")+"/"+yr;
    if(!S.items[nm])S.items[nm]=[];
    var nid=++S.seq;
    S.items[nm].unshift({id:nid,t:f.i.t,g:f.i.g,amt:f.i.amt,paid:0,d:"01/"+nm.split("/")[0],at:nowStamp(nm),acc:f.i.acc,pays:[],files:[]});
    toast("Đã chép sang tháng "+parseInt(nm,10),true);
  }

  /* Bottom Sheet — Kéo đóng & Snap Detents mượt chuẩn iOS */
  var sheet=$("sheet"),scrim=$("scrim"),shBar=$("shBar"),shBody=$("shBody");
  var SH={kind:null,id:null,detents:[0],pos:0};

  function setPos(px){
    SH.pos=px;
    sheet.style.transform="translateY("+px+"px)";
    scrim.classList.add("on");
  }
  function closeSheet(){
    closeMenu();
    SH.kind=null;SH.id=null;
    sheet.classList.remove("dragging");
    sheet.style.transform="translateY(105%)";
    scrim.classList.remove("on");
  }
  scrim.onclick=closeSheet;

  (function(){
    var drag=null;
    sheet.addEventListener("pointerdown",function(e){
      if(P||MN)return;
      var inGrab=e.target.closest("#grab")||e.target.closest("#shBar");
      if(!inGrab&&e.target.closest("button,input,textarea"))return;
      if(!inGrab&&shBody.scrollTop>0)return;
      drag={sy:e.clientY,sp:SH.pos,lastY:e.clientY,lastT:performance.now(),v:0,moved:false,inGrab:!!inGrab};
    });
    window.addEventListener("pointermove",function(e){
      if(!drag)return;
      var dy=e.clientY-drag.sy;
      if(!drag.moved){
        if(Math.abs(dy)<6)return;
        if(!drag.inGrab&&dy<0&&SH.pos===0){drag=null;return}
        drag.moved=true;sheet.classList.add("dragging");
      }
      var now=performance.now(),dt=Math.max(1,now-drag.lastT);
      drag.v=(e.clientY-drag.lastY)/dt;drag.lastY=e.clientY;drag.lastT=now;
      var np=drag.sp+dy;
      if(np<0)np*=0.22;
      sheet.style.transform="translateY("+np+"px)";
    });
    function end(){
      if(!drag)return;
      var d=drag;drag=null;
      if(!d.moved)return;
      sheet.classList.remove("dragging");
      var cur=parseFloat((sheet.style.transform.match(/([-\d.]+)px/)||[0,SH.pos])[1]);
      var h=sheet.offsetHeight, maxD=SH.detents[SH.detents.length-1]||0;
      if(d.v>0.65||cur>maxD+(h-maxD)*0.38){closeSheet();return}
      if(d.v<-0.5){setPos(SH.detents[0]);return}
      var best=SH.detents[0];
      SH.detents.forEach(function(dt){if(Math.abs(dt-cur)<Math.abs(best-cur))best=dt});
      setPos(best);
    }
    window.addEventListener("pointerup",end);
    window.addEventListener("pointercancel",end);
  })();

  function guessGroup(s){
    s=s.toLowerCase();
    if(/kế toán|dịch vụ kế toán|thuế|chứng từ|hành chính|văn phòng/.test(s))return "ad";
    if(/lãi vay|ngân hàng|vay|tài chính/.test(s))return "fn";
    if(/điện|nước|internet|wifi|tiện ích/.test(s))return "ut";
    if(/kho|thuê|mặt bằng|vận chuyển|bốc xếp/.test(s))return "op";
    if(/lương|thưởng|nhân sự|bhxh|tạm ứng/.test(s))return "pe";
    if(/quảng cáo|ads|facebook|google|tiktok|tiếp khách|marketing/.test(s))return "mk";
    if(/phần mềm|crm|hosting|domain|tên miền|server/.test(s))return "sw";
    return null;
  }

  function parseSmart(raw){
    var s=raw.trim(), acc=null;
    if(/\b(tm|tiền mặt)\b/i.test(s)){acc="Tiền mặt";s=s.replace(/\b(tm|tiền mặt)\b/ig,"").trim();}
    else if(/\b(ck|chuyển khoản|ngân hàng)\b/i.test(s)){acc="TK ngân hàng";s=s.replace(/\b(ck|chuyển khoản|ngân hàng)\b/ig,"").trim();}
    var m=s.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(tr|triệu|trieu|m|k|nghìn|ngàn|đ|d)?$/i);
    if(!m||!m[1].trim())return {t:s,a:null,acc:acc};
    var n=parseFloat(m[2].replace(",",".")), u=(m[3]||"").toLowerCase(), a;
    if(u==="tr"||u==="triệu"||u==="trieu"||u==="m")a=Math.round(n*1e6);
    else if(u==="k"||u==="nghìn"||u==="ngàn")a=Math.round(n*1e3);
    else if(n<1000)a=Math.round(n*1e3);
    else a=Math.round(n);
    return {t:m[1].trim(),a:a,acc:acc};
  }

  /* Bàn phím số tiền dùng chung */
  var P=null;
  var histFor=function(t){for(var k in HIST)if(t&&t.indexOf(k)===0)return HIST[k];return null};
  function histChips(h){
    if(!h)return [];
    var avg=Math.round(h.reduce(function(s,x){return s+x[1]},0)/h.length);
    var c=h.slice().reverse().map(function(x){return {l:x[0]+" · "+vnd(x[1]),v:x[1]}});
    if(h.some(function(x){return x[1]!==h[0][1]}))c.push({l:"TB 3 tháng · "+vnd(avg),v:avg});
    return c;
  }
  function cmpHint(prev,label){
    return function(v){
      var d=v-prev;
      if(!d)return {t:"Bằng "+label,c:""};
      return {t:(d>0?"+":"−")+vnd(Math.abs(d))+" so với "+label,c:d>0?"up":"down"};
    };
  }
  var evalE=function(e){
    var t=e.match(/[+-]|\d+/g)||[],v=0,op="+";
    t.forEach(function(x){if(x==="+"||x==="-")op=x;else v=op==="+"?v+(+x):v-(+x)});
    return v;
  };
  var fmtExpr=function(e){return e.replace(/\d+/g,function(d){return vnd(+d)}).replace(/\+/g," + ").replace(/-/g," − ")};
  var KEYS=[["1"],["2"],["3"],["del"],["4"],["5"],["6"],["+","+"],["7"],["8"],["9"],["-","−"],["000"],["0"],["C","C"],["ok","Xong"]];
  $("keys").innerHTML=KEYS.map(function(k){
    var v=k[0],op=/^(del|\+|-|C)$/.test(v);
    var label=v==="del"?'<svg class="ic"><use href="#i-del"/></svg>':(k[1]||v);
    var aria=v==="del"?"Xoá một số":v==="C"?"Xoá hết":v==="-"?"Trừ":v==="+"?"Cộng":v==="ok"?"Xong":v;
    return '<button type="button" class="key'+(op?' op':'')+(v==="ok"?' done':'')+'" data-k="'+v+'"'+(v==="ok"?' id="kOk"':'')+' aria-label="'+aria+'">'+label+'</button>';
  }).join("");
  $("keys").addEventListener("click",function(e){var b=e.target.closest(".key");if(b&&!b.disabled)key(b.dataset.k)});

  function openPad(o){
    var ae=document.activeElement;if(ae&&ae.blur)ae.blur();
    P=o;P.e=o.value?String(o.value):"";P.fresh=!!o.value;
    P.minMsg=o.minMsg||"Không thấp hơn ";P.maxMsg=o.maxMsg||"Tối đa ";

        });
      };

    var cs=o.chips||[];
    $("padC").innerHTML=cs.map(function(c,k){return '<button type="button" class="chipx num" data-c="'+k+'">'+esc(c.l)+'</button>'}).join("");
    $("padC").hidden=!cs.length;

      b.onclick=function(){P.e=String(cs[+b.dataset.c].v);P.fresh=true;padShow()};
    });
    $("pad").classList.add("on");$("pdim").classList.add("on");
    padShow();setTimeout(function(){if(P)$("pad").focus({preventScroll:true})},60);
  }
  function padShow(){
    var v=evalE(P.e),h;
    if(!P.e)h={t:"Nhập số tiền",c:"",bad:true};
    else if(v<=0)h={t:"Số tiền phải lớn hơn 0",c:"err",bad:true};
    else if(P.min!=null&&v<P.min)h={t:P.minMsg+vnd(P.min),c:"err",bad:true};
    else if(P.max!=null&&v>P.max)h={t:P.maxMsg+vnd(P.max),c:"err",bad:true};
    else h=P.hint?P.hint(v):{t:"",c:""};
    $("padV").textContent=vnd(v);$("padV").classList.toggle("sel",P.fresh&&!!P.e);
    $("padE").textContent=/[+-]/.test(P.e)?fmtExpr(P.e):"";
    $("padH").textContent=h.t;$("padH").className="pad-hint num"+(h.c?" "+h.c:"");
    $("kOk").disabled=!!h.bad;
    $("padC").querySelectorAll(".chipx").forEach(function(b){b.classList.toggle("on",(P.chips[+b.dataset.c]||{}).v===v)});
  }
  function key(k){
    if(!P)return;
    if(k==="ok"){if($("kOk").disabled)return;var v=evalE(P.e),acc=P.acc,cb=P.onDone;closePad();setTimeout(function(){cb(v,acc)},160);return}
    if(k==="C"){P.e="";P.fresh=false}
    else if(k==="del"){if(P.fresh){P.e="";P.fresh=false}else P.e=P.e.slice(0,-1)}
    else if(k==="+"||k==="-"){P.fresh=false;if(!P.e)return;P.e=/[+-]$/.test(P.e)?P.e.slice(0,-1)+k:P.e+k}
    else{
      if(P.fresh){P.e="";P.fresh=false}
      var cur=(P.e.match(/\d*$/)||[""])[0];
      if(k==="000"&&!cur)return;
      if(cur==="0"){if(k==="0"||k==="000")return;P.e=P.e.slice(0,-1);cur=""}
      if((cur+k).length>13)return;
      P.e+=k;
    }
    padShow();
  }
  function closePad(){$("pad").classList.remove("on");$("pdim").classList.remove("on");P=null}
  $("padX").onclick=closePad;$("pdim").onclick=closePad;
  document.addEventListener("keydown",function(e){
    if(MN&&e.key==="Escape"){closeMenu();return}
    if(!P)return;var k=e.key;
    if(/^[0-9]$/.test(k))key(k);else if(k==="Backspace")key("del");else if(k==="+")key("+");else if(k==="-")key("-");
    else if(k==="Enter")key("ok");else if(k==="Escape")closePad();else return;
    e.preventDefault();
  });

  function refreshDetail(id){
    if(SH.kind!=="detail"||SH.id!==id)return;
    var f=find(id);if(!f)return;
    fillDetail(f.i,f.m);SH.detents=fitDetail();
    if(SH.pos>4)setPos(SH.detents[SH.detents.length-1]);
  }
  function setTitle(id,v){
    var f=find(id);if(!f||f.i.t===v)return;
    save();f.i.t=v;S.flash[id]=1;render();refreshDetail(id);toast("Đã đổi tên",true);
  }
  function setGroup(id,k){
    var f=find(id);if(!f||f.i.g===k)return;
    save();f.i.g=k;S.flash[id]=1;render();refreshDetail(id);toast("Đã chuyển sang "+G[k].n,true);
  }
  function setAmount(id,v){
    var f=find(id);if(!f)return;var i=f.i;
    if(v<i.paid){toast("Không thấp hơn số đã trả "+vnd(i.paid),false);return}
    if(v===i.amt)return;
    save();var old=i.amt;i.amt=v;S.flash[id]=1;render();refreshDetail(id);
    toast("Đã sửa "+vnd(old)+" → "+vnd(v),true);
  }
  function editAmount(id){
    var f=find(id);if(!f)return;var i=f.i;
    openPad({
      title:"Số tiền · "+i.t,value:i.amt,chips:histChips(histFor(i.t)),
      min:i.paid>0?i.paid:null,minMsg:"Không thấp hơn số đã trả ",
      hint:cmpHint(i.amt,"số cũ"),onDone:function(v){setAmount(id,v)}
    });
  }
  function payPad(id){
    var f=find(id);if(!f)return;var i=f.i,left=i.amt-i.paid,half=Math.round(left/2);
    openPad({
      title:"Trả · "+i.t,value:left,acc:i.acc||"TK ngân hàng",
      chips:[{l:"Còn lại · "+vnd(left),v:left}].concat(left>=2000?[{l:"Một nửa · "+vnd(half),v:half}]:[]),
      max:left,maxMsg:"Tối đa là số còn lại ",
      hint:function(v){return v<left?{t:"Sau lần này còn "+vnd(left-v)+" đ",c:""}:{t:"Trả đủ khoản này",c:"down"}},
      onDone:function(v,acc){pay(id,v,acc)}
    });
  }
  function recurPad(k){
    var r=RECUR[k],h=HIST[r.h],cur=S.recurAmt[k]!=null?S.recurAmt[k]:r.amt;
    openPad({
      title:"Số tiền · "+r.t,value:cur,chips:histChips(h),
      hint:cmpHint(h[h.length-1][1],h[h.length-1][0]),
      onDone:function(v){S.recurAmt[k]=v;renderRecur()}
    });
  }

  $("addBtn").onclick=openAdd;
  $("themeBtn").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme",cur==="dark"?"light":"dark");
  };
  $("reset").onclick=function(){
    closeSheet();closeCtx();closePad();
    S=fresh();snap=null;$("toast").classList.remove("on");
    $("searchWrap").classList.remove("on");$("searchToggle").classList.remove("on");$("qInput").value="";
    buildSeg();sc.scrollTop=0;render();
  };

  buildSeg();render();
})();
</script>
</body>
</html>
