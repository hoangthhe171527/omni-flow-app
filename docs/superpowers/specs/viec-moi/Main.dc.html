<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Việc – Team và kế hoạch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A7D76}a:hover{color:#075E59}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
button,a{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.97)}
.bar{background:rgba(245,247,250,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.hb{width:44px;height:44px;border:0;background:transparent;color:#0B1A33;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;padding:0}
.grp{background:#fff;border:1px solid #E3E8EF;border-radius:8px;overflow:hidden}
.gh{width:100%;min-height:48px;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;font:600 15px 'Be Vietnam Pro',sans-serif;color:#0B1A33;cursor:pointer;text-align:left}
.pl{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 4px 0 12px;border-top:1px solid #EEF1F5;text-decoration:none;color:#0B1A33}
.tile{width:28px;height:28px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
.meta{font-size:12px;color:#56637A}
.late{font-size:12px;font-weight:600;color:#B42318}
.ib{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#56637A;padding:0;flex-shrink:0;position:relative}
.dot{position:absolute;top:9px;right:8px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#0A7D76;color:#fff;font-size:12px;line-height:16px;font-weight:600;text-align:center}
.tab{flex:1;height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 12px 'Be Vietnam Pro',sans-serif;color:#56637A;cursor:pointer;padding:0}
.tab.on{color:#0A7D76;font-weight:600}
.mi{width:100%;min-height:52px;border:0;background:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;font:500 15px 'Be Vietnam Pro',sans-serif;color:#0B1A33;cursor:pointer;text-align:left}
.mi+.mi{border-top:1px solid #EEF1F5}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0B1A33;background:#F5F7FA;font-size:14px">

  <header class="bar" style="position:absolute;top:0;left:0;right:0;z-index:3;padding:46px 8px 8px 16px;border-bottom:1px solid rgba(11,26,51,.06)">
    <div style="display:flex;align-items:center;gap:4px">
      <span style="width:28px;height:28px;border-radius:7px;background:#0A7D76;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l8 12 8-12"></path></svg></span>
      <span style="font-weight:600;font-size:17px;margin-left:6px;flex-grow:1">Viomni</span>
      <button class="hb" aria-label="Thông báo"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg></button>
      <button class="hb" aria-label="Tài khoản"><span style="width:30px;height:30px;border-radius:15px;background:#0B1A33;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">TN</span></button>
    </div>
    <div style="display:flex;gap:8px;margin-top:6px;padding-right:8px">
      <label style="flex-grow:1;height:40px;border-radius:6px;background:#EEF1F5;display:flex;align-items:center;gap:8px;padding:0 12px;color:#56637A">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input aria-label="Tìm team, kế hoạch" placeholder="Tìm team, kế hoạch" value="{{q}}" onInput="{{onQ}}" style="border:0;background:transparent;outline:0;font:400 14px 'Be Vietnam Pro',sans-serif;color:#0B1A33;flex-grow:1;min-width:0">
      </label>
      <button aria-label="Tạo mới" onClick="{{toggleAdd}}" style="width:44px;height:40px;border-radius:6px;border:0;background:{{addBg}};color:{{addFg}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="transform:rotate({{addRot}});transition:transform .3s cubic-bezier(.2,.8,.2,1)"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
  </header>

  <main style="position:absolute;top:150px;left:0;right:0;bottom:0;overflow-y:auto;padding:12px 16px 110px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px">

    <sc-if value="{{showFav}}" hint-placeholder-val="{{true}}">
    <section class="grp" style="animation:rise .35s both">
      <button class="gh" onClick="{{toggleFav}}" aria-expanded="{{favOpen}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#E8890C" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
        <span style="flex-grow:1">Yêu thích</span>
        <span class="meta" style="font-weight:500">{{favCount}}</span>
        <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#56637A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{favRot}});transition:transform .3s cubic-bezier(.2,.8,.2,1)"><path d="m6 9 6 6 6-6"></path></svg></span>
      </button>
      <sc-if value="{{favOpen}}" hint-placeholder-val="{{true}}">
        <sc-for list="{{favs}}" as="p" hint-placeholder-count="2">
          <a class="pl" href="Board.dc.html">
            <span class="tile" style="background:{{p.c}}">{{p.i}}</span>
            <span style="flex-grow:1;min-width:0"><span style="display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.n}}</span><span class="meta">{{p.team}} · {{p.open}} việc</span></span>
            <sc-if value="{{p.late}}" hint-placeholder-val="{{false}}"><span class="late">{{p.late}} trễ</span></sc-if>
            <span class="ib" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA5B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span>
          </a>
        </sc-for>
      </sc-if>
    </section>
    </sc-if>

    <sc-for list="{{teams}}" as="t" hint-placeholder-count="3">
      <section class="grp" style="animation:rise .35s both;animation-delay:{{t.delay}}">
        <button class="gh" onClick="{{t.toggle}}" aria-expanded="{{t.open}}">
          <span class="tile" style="background:{{t.c}}">{{t.i}}</span>
          <span style="flex-grow:1">{{t.n}}</span>
          <span class="meta" style="font-weight:500">{{t.count}} kế hoạch</span>
          <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#56637A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{t.rot}});transition:transform .3s cubic-bezier(.2,.8,.2,1)"><path d="m6 9 6 6 6-6"></path></svg></span>
        </button>
        <sc-if value="{{t.open}}" hint-placeholder-val="{{true}}">
          <sc-for list="{{t.plans}}" as="p" hint-placeholder-count="2">
            <a class="pl" href="Board.dc.html">
              <span class="tile" style="background:{{p.c}}">{{p.i}}</span>
              <span style="flex-grow:1;min-width:0"><span style="display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.n}}</span><span class="meta">{{p.open}} việc đang mở</span></span>
              <sc-if value="{{p.late}}" hint-placeholder-val="{{false}}"><span class="late">{{p.late}} trễ</span></sc-if>
              <button class="ib" aria-label="{{p.favLabel}}" aria-pressed="{{p.fav}}" onClick="{{p.toggleFav}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="{{p.favFill}}" stroke="{{p.favStroke}}" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></button>
            </a>
          </sc-for>
        </sc-if>
      </section>
    </sc-for>

    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center;padding:48px 16px;color:#56637A"><div style="font-weight:600;color:#0B1A33">Không thấy “{{q}}”</div><div style="font-size:13px;margin-top:4px">Thử tên team hoặc tên kế hoạch khác.</div></div>
    </sc-if>
  </main>

  <sc-if value="{{addOpen}}" hint-placeholder-val="{{false}}">
    <button aria-label="Đóng" onClick="{{toggleAdd}}" style="position:absolute;inset:0;z-index:5;border:0;padding:0;cursor:default;background:rgba(11,26,51,.22);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .2s both"></button>
    <div role="menu" style="position:absolute;top:142px;right:16px;z-index:6;width:220px;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 12px 32px rgba(11,26,51,.18);transform-origin:top right;animation:pop .28s cubic-bezier(.2,.9,.25,1) both">
      <button class="mi" role="menuitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A7D76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M18 8v6M15 11h6"></path></svg>Tạo team</button>
      <button class="mi" role="menuitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A7D76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16M15 4v10"></path></svg>Tạo kế hoạch</button>
    </div>
  </sc-if>

  <nav class="bar" style="position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;padding:0 4px 26px;border-top:1px solid rgba(11,26,51,.06)">
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12 12 4l9 8"></path><path d="M5 10v10h14V10"></path></svg>Tổng quan</button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Hộp thư</button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c1.9.6 3.1 2.5 3.5 5.4"></path></svg>Khách</button>
    <button class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16M15 4v10"></path></svg>Việc</button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg>Tất cả</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startAddOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { q: '', add: !!p.startAddOpen, fav: true, favs: {}, open: { a: true, b: true, c: false } }; }
renderVals() {
const s = this.state;
const PL = {
  a: { n: 'Tổ kỹ thuật', i: 'K', c: '#0B1A33', plans: [['Bảo hành', 'B', '#0A7D76', 9, 2, 3, 1], ['Tân trang đàn piano cơ', 'T', '#2563EB', 14, 0, 0, 1], ['Sửa chữa tại nhà', 'S', '#E8890C', 6, 1, 0, 0]] },
  b: { n: 'Kinh doanh', i: 'D', c: '#7C3AED', plans: [['Chăm sóc khách sau bán', 'C', '#0A7D76', 21, 4, 5, 0], ['Sự kiện tháng 10', 'S', '#DC2626', 7, 0, 0, 0]] },
  c: { n: 'Kho & giao nhận', i: 'G', c: '#56637A', plans: [['Giao đàn nội thành', 'G', '#2563EB', 4, 0, 1, 0]] }
};
const q = s.q.trim().toLowerCase();
const hit = (team, p) => !q || team.n.toLowerCase().includes(q) || p[0].toLowerCase().includes(q);
const favOf = (k, p) => (s.favs && (k + p[0]) in s.favs) ? s.favs[k + p[0]] : !!p[6];
const teams = Object.keys(PL).map((k, ti) => {
  const t = PL[k];
  const plans = t.plans.filter(p => hit(t, p)).map(p => { const f = favOf(k, p); return { n: p[0], i: p[1], c: p[2], open: p[3], late: p[4] || false,
    fav: f, favFill: f ? '#E8890C' : 'none', favStroke: f ? '#E8890C' : '#9AA5B8', favLabel: f ? 'Bỏ khỏi yêu thích' : 'Thêm vào yêu thích',
    toggleFav: e => { e.preventDefault(); e.stopPropagation(); this.setState({ favs: Object.assign({}, s.favs, { [k + p[0]]: !f }) }); } }; });
  const open = q ? true : s.open[k];
  return { n: t.n, i: t.i, c: t.c, count: t.plans.length, plans, open, rot: open ? '180deg' : '0deg', delay: (ti * 0.05) + 's',
    toggle: () => this.setState({ open: Object.assign({}, s.open, { [k]: !s.open[k] }) }) };
}).filter(t => t.plans.length);
const favs = [];
Object.keys(PL).forEach(k => PL[k].plans.forEach(p => { if (favOf(k, p) && hit(PL[k], p)) favs.push({ n: p[0], i: p[1], c: p[2], open: p[3], late: p[4] || false, team: PL[k].n }); }));
return {
  q: s.q, onQ: e => this.setState({ q: e.target.value }),
  addOpen: s.add, toggleAdd: () => this.setState({ add: !s.add }),
  addBg: s.add ? '#0B1A33' : '#0A7D76', addFg: '#fff', addRot: s.add ? '45deg' : '0deg',
  showFav: favs.length > 0, favOpen: s.fav, favRot: s.fav ? '180deg' : '0deg', favCount: favs.length, favs,
  toggleFav: () => this.setState({ fav: !s.fav }),
  teams, empty: teams.length === 0 && favs.length === 0
};
}
}
</script>
</body>
</html>
