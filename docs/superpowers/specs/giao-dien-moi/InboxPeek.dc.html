<helmet>

<style>
body{margin:0}
a{color:#0A7D76}a:hover{color:#075E59}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.dot{width:8px;height:8px;border-radius:2px}
.wrap{position:relative;overflow:hidden;border-top:1px solid #EEF1F5}

.mi:hover{background:rgba(11,26,51,.05)}
.acts{position:absolute;top:0;right:0;bottom:0;display:flex}

.row:hover{background:#FAFBFC}
.open{color:#0B1A33;text-decoration:none;display:flex;align-items:center;gap:10px;flex-grow:1;min-width:0}
.more{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:#8A95A8;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex-shrink:0}
.more:hover{background:#EEF1F5;color:#0B1A33}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#56637A;text-decoration:none;padding-top:9px;position:relative}
.tab.on{color:#0A7D76}
.tab.on::before{content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:#0A7D76}
.plus{width:46px;height:36px;border-radius:8px;background:#0A7D76;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(10,125,118,.32)}

                  <span style="font-size:13px;color:{{r.mc}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-grow:1">{{r.m}}</span>
                  <sc-if value="{{r.unread}}" hint-placeholder-val="{{false}}"><span style="min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#0A7D76;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{r.unread}}</span></sc-if>
                  <span style="width:20px;height:20px;border-radius:4px;background:{{r.asBg}};color:{{r.asFg}};font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{r.as}}</span>
                </span>
              </span>
            </a>
          </div>

  <sc-if value="{{pk}}" hint-placeholder-val="{{false}}">

    <div style="position:absolute;left:16px;right:16px;top:110px;z-index:7;display:flex;flex-direction:column;gap:10px;pointer-events:none">
      <a href="Thread.dc.html" style="pointer-events:auto;display:block;background:#F5F7FA;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(11,26,51,.35);text-decoration:none;color:#0B1A33;transform-origin:50% 30%;animation:peek .42s cubic-bezier(.2,1.1,.3,1) both">
        <span style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #E3E8EF">
          <span style="width:34px;height:34px;border-radius:6px;background:{{pk.bg}};color:{{pk.fg}};display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px">{{pk.i}}</span>
          <span style="flex-grow:1"><span style="display:block;font-weight:700">{{pk.n}}</span><span style="display:block;font-size:12px;color:#56637A"><span style="font-weight:700;color:{{pk.chC}}">{{pk.srcK}}</span> · {{pk.srcN}} · {{pk.t}}</span></span>

        <span style="display:flex;flex-direction:column;gap:6px;padding:14px">
          <sc-for list="{{pk.msgs}}" as="m" hint-placeholder-count="4">
            <span style="max-width:78%;align-self:{{m.side}};background:{{m.bg}};color:{{m.c}};border-radius:{{m.rad}};padding:8px 12px;font-size:14px;line-height:1.4;animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{m.delay}}">{{m.text}}</span>

      <div style="pointer-events:auto;width:230px;background:rgba(255,255,255,.88);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:12px;overflow:hidden;box-shadow:0 16px 40px rgba(11,26,51,.25);transform-origin:20% 0;animation:peek .42s cubic-bezier(.2,1.1,.3,1) .05s both">
        <sc-for list="{{menu}}" as="it" hint-placeholder-count="5">
          <button class="mi" style="color:{{it.c}}" onClick="{{it.go}}">{{it.l}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d}}"></path></svg></button>

  </nav>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { seg: 0, ch: { zalo: true, fb: true, web: true, mail: true }, swiped: null, read: {}, search: false, peek: 2 }; }
renderVals() {
const s = this.state, g = '#56637A';
const CH = { zalo: ['Zalo', '#0068FF'], fb: ['Facebook', '#5B4BDB'], web: ['Website', '#0A7D76'], mail: ['Email', '#C2410C'] };
const D = [
{ id: 1, ch: 'zalo', i: 'LA', bg: '#E6F3F2', fg: '#075E59', n: 'Lan Anh', srcK: 'OA', srcN: 'Trung Nguyên', tag: 'Đặt lịch', m: 'Bên mình còn lịch chiều nay không ạ?', t: '4p', urg: 1, unread: 2, as: 'HT', mine: 1 },
{ id: 2, ch: 'fb', i: 'MT', bg: '#FDECE3', fg: '#9A3412', n: 'Minh Tú', srcK: 'Page', srcN: 'Viomni Spa', tag: 'Báo giá', m: 'Em gửi lại báo giá giúp chị nhé', t: '12p', unread: 1, as: '' },
{ id: 3, ch: 'web', i: 'PD', bg: '#EEF1F5', fg: '#0B1A33', n: 'Phạm Duy', srcK: 'Web', srcN: 'viomni.vn', tag: '', m: 'Cho mình hỏi gói tháng giá bao nhiêu?', t: '35p', unread: 3, as: '' },
{ id: 4, ch: 'zalo', i: 'SH', bg: '#E6F3F2', fg: '#075E59', n: 'Spa Hạnh Phúc', srcK: 'OA', srcN: 'Viomni CSKH', tag: 'Hợp đồng', m: 'Bạn: Dạ em đã gửi hợp đồng ạ', t: '09:12', unread: 0, as: 'HT', mine: 1 },
{ id: 5, ch: 'mail', i: 'TQ', bg: '#FFF4D6', fg: '#7A5200', n: 'Trần Quang', srcK: 'Mail', srcN: 'sales@viomni.vn', tag: '', m: 'Re: Xác nhận lịch triển khai tuần sau', t: 'Hôm qua', unread: 1, as: 'NL' },
{ id: 6, ch: 'fb', i: 'NM', bg: '#EEF1F5', fg: '#0B1A33', n: 'Ngọc Mai', srcK: 'Page', srcN: 'Trung Nguyên', tag: '', m: 'Bạn: Đã nhận thanh toán, cảm ơn chị', t: 'Hôm qua', unread: 0, as: 'HT', mine: 1 },
{ id: 7, ch: 'web', i: 'VK', bg: '#FDECE3', fg: '#9A3412', n: 'Vũ Khánh', srcK: 'Web', srcN: 'shop.viomni.vn', tag: 'Khiếu nại', m: 'Đơn hàng của tôi giao chậm 3 ngày rồi', t: 'T4', unread: 0, as: 'NL' }
];
const un = d => s.read[d.id] ? 0 : d.unread;
const tests = [() => true, d => un(d) > 0, d => d.mine, d => !d.as];
const list = D.filter(d => s.ch[d.ch] && tests[s.seg](d));
return {
nF: (s.seg ? 1 : 0) + Object.keys(CH).filter(k => !s.ch[k]).length || false,
fbCls: s.filters ? 'ib fon' : 'ib', fOpen: s.filters ? 'true' : 'false', toggleF: () => this.setState({ filters: !s.filters }),
fRows: s.filters ? '1fr' : '0fr', fOp: s.filters ? 1 : 0, fMt: s.filters ? '0' : '-10px', mainTop: s.filters ? '230px' : '146px',
segName: ['Tất cả', 'Chưa đọc', 'Của tôi', 'Chưa gán'][s.seg],
segs: ['Tất cả', 'Chưa đọc · ' + D.filter(d => un(d) > 0).length, 'Của tôi', 'Chưa gán'].map((l, i) => ({ label: l, cls: i === s.seg ? 'seg on' : 'seg', pick: () => this.setState({ seg: i, swiped: null }) })),
segX: 'translateX(' + (s.seg * 100) + '%)',
chs: Object.keys(CH).map(k => ({ label: CH[k][0], color: CH[k][1], on: s.ch[k] ? 'true' : 'false', cls: s.ch[k] ? 'chip on' : 'chip', toggle: () => this.setState({ ch: { ...s.ch, [k]: !s.ch[k] } }) })),
count: list.length, empty: list.length === 0,
rows: list.map(d => { const u = un(d), hold = s.holding === d.id; return { ...d, unread: u, tagC: this.tagC(d.tag),
  w: u ? 700 : 500, mc: u ? '#0B1A33' : g, tc: d.urg && u ? '#C2410C' : g, chC: CH[d.ch][1],
  as: d.as || '–', asBg: d.as ? '#0B1A33' : '#EEF1F5', asFg: d.as ? '#fff' : '#8A95A8',
  scale: hold ? 'scale(.965)' : 'none', dur: hold ? '.45s' : '.2s',
  press: () => { this.long = false; clearTimeout(this.tm); this.setState({ holding: d.id });
    this.tm = setTimeout(() => { this.long = true; if (navigator.vibrate) navigator.vibrate(10); this.setState({ peek: d.id, holding: null }); }, 450); } }; }),
cancel: () => { clearTimeout(this.tm); if (this.state.holding) this.setState({ holding: null }); },
guard: e => { if (this.long) { e.preventDefault(); this.long = false; } },
noMenu: e => e.preventDefault(),
closePeek: () => this.setState({ peek: null }),
pk: this.peekData(D, CH, un),
menu: this.peekMenu(un, D)
