<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tổng quan v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A7D76}a:hover{color:#075E59}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.r{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}
button,a{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.96)}
.bar{background:rgba(245,247,250,.8);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.card{background:#fff;border:1px solid #E3E8EF;border-radius:8px}
.ib{width:36px;height:36px;border-radius:6px;border:1px solid #E3E8EF;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:#0B1A33;position:relative;text-decoration:none}
.lbl{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#56637A}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #EEF1F5;text-decoration:none;color:#0B1A33;width:100%;box-sizing:border-box;background:transparent;border-left:0;border-right:0;border-bottom:0;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:#F5F7FA}
.seg{flex:1;height:30px;border:0;background:transparent;font:600 12px 'Be Vietnam Pro',sans-serif;color:#56637A;cursor:pointer;position:relative;z-index:1}
.seg.on{color:#0B1A33}
.chk{width:18px;height:18px;border-radius:4px;border:1.5px solid #C9D2DE;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.chk.on{background:#0A7D76;border-color:#0A7D76;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.done{color:#8A95A8;text-decoration:line-through;transition:color .3s}
@keyframes drawL{to{stroke-dashoffset:0}}
.att{display:flex;flex-direction:column;gap:1px;padding:9px 10px;text-decoration:none;color:#56637A;font-size:11px;font-weight:500}
.att:hover{border-color:#0A7D76}
.chev{width:28px;height:28px;margin:-4px -6px -4px 0;border:0;border-radius:6px;background:transparent;color:#56637A;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.chev:hover{background:#EEF1F5;color:#0B1A33}
.chev svg{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#56637A;text-decoration:none;padding-top:9px;position:relative}
.tab.on{color:#0A7D76}
.tab.on::before{content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:#0A7D76}
.plus{width:46px;height:36px;margin-top:6px;border-radius:8px;border:0;background:#0A7D76;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(10,125,118,.32)}
.plus svg{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid #E3E8EF;border-radius:8px;background:#fff;font:500 12px 'Be Vietnam Pro',sans-serif;color:#0B1A33;cursor:pointer;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.act:hover{border-color:#0A7D76}
.ai{width:34px;height:34px;border-radius:8px;background:#E6F3F2;color:#0A7D76;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0B1A33;background:#F5F7FA;font-size:14px">
  <header class="bar" style="position:absolute;top:0;left:0;right:0;z-index:2;padding:52px 16px 10px;border-bottom:1px solid rgba(11,26,51,.06);display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="display:flex;align-items:center;gap:8px;flex-shrink:0"><svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><rect x="1.5" y="1.5" width="97" height="97" rx="23" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="3"></rect><path d="M12.5 58.2 A40 11 -20 0 1 87.5 29.8" fill="none" stroke="#0A7D76" stroke-width="6" stroke-linecap="round"></path><circle cx="49" cy="45" r="21" fill="#FFFFFF" stroke="#0A7D76" stroke-width="6"></circle><path d="M37 62 L33.5 75 L46 66.5" fill="none" stroke="#0A7D76" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12.5 58.2 A40 11 -20 0 0 87.5 29.8" fill="none" stroke="#0A7D76" stroke-width="6" stroke-linecap="round"></path><circle cx="73" cy="26" r="7" fill="#FFC43D" stroke="#FFFFFF" stroke-width="3"></circle></svg><span style="font-size:19px;font-weight:700;letter-spacing:-.4px">Vi<span style="color:#0A7D76">omni</span></span></span>
      <span style="flex-grow:1"></span>
      <a class="ib" href="Notifications.dc.html" aria-label="Thông báo, 3 mới"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:4px;background:#E5484D"></span></a>
      <a href="Me.dc.html" aria-label="Tài khoản" style="width:36px;height:36px;border-radius:6px;background:#0B1A33;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;text-decoration:none;flex-shrink:0">HT</a>
    </div>
    <div style="position:relative;display:flex;background:#EEF1F5;border-radius:6px;padding:3px">
      <span style="position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / 3);border-radius:4px;background:#fff;box-shadow:0 1px 3px rgba(11,26,51,.12);transform:{{segX}};transition:transform .35s cubic-bezier(.2,.8,.2,1)"></span>
      <sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
        <button class="{{p.cls}}" onClick="{{p.pick}}">{{p.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="position:absolute;top:146px;left:0;right:0;bottom:84px;padding:12px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
    <div class="card r" style="padding:12px 12px 10px">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div style="flex-grow:1">
          <div class="lbl">{{rv.cap}}</div>
          <div style="display:flex;align-items:baseline;gap:8px;margin-top:2px"><span style="font-size:26px;font-weight:700;letter-spacing:-.6px">{{rv.big}}</span><span style="font-size:12px;font-weight:600;color:{{rv.dC}};background:{{rv.dBg}};padding:1px 6px;border-radius:4px">{{rv.delta}}</span></div>
          <div style="font-size:11px;color:#56637A;margin-top:1px">{{rv.sub}}</div>
        </div>
      </div>
      <div style="position:relative;margin-top:8px;touch-action:pan-y;cursor:crosshair" onPointerMove="{{scrub}}" onPointerDown="{{scrub}}" onPointerLeave="{{unscrub}}">
        <svg width="334" height="112" viewBox="0 0 334 112" style="display:block;overflow:visible">
          <line x1="0" x2="334" y1="{{rv.ty}}" y2="{{rv.ty}}" stroke="#E8890C" stroke-width="1" stroke-dasharray="3 3"></line>
          <text x="334" y="{{rv.tyT}}" text-anchor="end" font-size="9" font-weight="600" fill="#9A3412">Mục tiêu {{rv.target}}</text>
          <path d="{{rv.prev}}" fill="none" stroke="#A9B2C1" stroke-width="1.5" stroke-dasharray="4 4"></path>
          <path d="{{rv.area}}" fill="#0A7D76" fill-opacity=".1"></path>
          <path d="{{rv.line}}" fill="none" stroke="#0A7D76" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:drawL .9s cubic-bezier(.65,0,.35,1) .1s forwards"></path>
          <path d="{{rv.proj}}" fill="none" stroke="#0A7D76" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round" opacity=".7"></path>
          <circle cx="{{rv.ex}}" cy="{{rv.ey}}" r="4" fill="#0A7D76" stroke="#fff" stroke-width="2"></circle>
          <sc-if value="{{sc.on}}" hint-placeholder-val="{{false}}">
            <line x1="{{sc.x}}" x2="{{sc.x}}" y1="0" y2="112" stroke="#0B1A33" stroke-width="1" opacity=".25"></line>
            <circle cx="{{sc.x}}" cy="{{sc.y}}" r="5" fill="#fff" stroke="#0A7D76" stroke-width="2.5"></circle>
          </sc-if>
        </svg>
        <sc-if value="{{sc.on}}" hint-placeholder-val="{{false}}">
          <div style="position:absolute;top:-6px;left:{{sc.tl}};transform:translateX(-50%);background:#0B1A33;color:#fff;border-radius:6px;padding:4px 8px;font-size:11px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(11,26,51,.25)"><b>{{sc.v}}</b> · {{sc.l}}<span style="display:block;font-size:10px;opacity:.75">Kỳ trước {{sc.p}}</span></div>
        </sc-if>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#8A95A8;margin-top:4px"><sc-for list="{{rv.ticks}}" as="k" hint-placeholder-count="4"><span>{{k}}</span></sc-for></div>
      <div style="display:flex;gap:14px;font-size:11px;color:#56637A;margin-top:8px;padding-top:8px;border-top:1px solid #EEF1F5"><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:2.5px;border-radius:2px;background:#0A7D76"></span>Kỳ này</span><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;border-top:1.5px dashed #A9B2C1"></span>Kỳ trước</span><span style="margin-left:auto;font-weight:600;color:#0B1A33">{{rv.pct}} mục tiêu</span></div>
    </div>


    <div class="card r d2" style="overflow:hidden">
      <div style="display:flex;align-items:center;padding:10px 12px"><span class="lbl" style="flex-grow:1">Việc của tôi · {{left}} còn lại</span><button class="chev" aria-label="{{tk.label}}" aria-expanded="{{tk.open}}" onClick="{{tk.toggle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{tk.rot}}"><path d="m6 9 6 6 6-6"></path></svg></button></div>
      <div style="max-height:{{tk.h}};opacity:{{tk.o}};overflow:hidden;transition:max-height .45s cubic-bezier(.2,.8,.2,1),opacity .3s">
      <sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
        <button class="row" onClick="{{t.toggle}}">
          <span class="{{t.chkCls}}"><sc-if value="{{t.done}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"></path></svg></sc-if></span>
          <span style="flex-grow:1;min-width:0;display:block">
            <span class="{{t.titleCls}}" style="display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.title}}</span>
            <span style="display:block;font-size:12px;color:#56637A">{{t.meta}}</span>
          </span>
          <span style="font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:{{t.bg}};color:{{t.c}}">{{t.when}}</span>
        </button>
      </sc-for>
      </div>
    </div>

    <div class="card r d2" style="overflow:hidden">
      <div style="display:flex;align-items:center;padding:10px 12px"><span class="lbl" style="flex-grow:1">Chờ phản hồi · 9</span><button class="chev" aria-label="{{wt.label}}" aria-expanded="{{wt.open}}" onClick="{{wt.toggle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{wt.rot}}"><path d="m6 9 6 6 6-6"></path></svg></button></div>
      <div style="max-height:{{wt.h}};opacity:{{wt.o}};overflow:hidden;transition:max-height .45s cubic-bezier(.2,.8,.2,1),opacity .3s">
      <sc-for list="{{waits}}" as="w" hint-placeholder-count="3">
        <a class="row" href="Thread.dc.html">
          <span style="width:30px;height:30px;border-radius:6px;background:{{w.bg}};color:{{w.fg}};display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0">{{w.i}}</span>
          <span style="flex-grow:1;min-width:0"><span style="display:flex;align-items:center;gap:6px;font-weight:600">{{w.n}}<span title="{{w.tag}}" aria-label="Nhãn: {{w.tag}}" style="width:7px;height:7px;border-radius:50%;background:{{w.tagC}}"></span></span><span style="display:block;font-size:12px;color:#56637A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{w.m}}</span></span>
          <span style="font-size:11px;color:{{w.tc}};font-weight:600">{{w.t}}</span>
        </a>
      </sc-for>
      </div>
    </div>
  </main>

  <nav class="bar" style="position:absolute;left:0;right:0;bottom:0;height:84px;border-top:1px solid rgba(11,26,51,.07);display:flex;align-items:flex-start;padding:0 6px;z-index:4">
    <a class="tab on" href="Main.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Tổng quan</a>
    <a class="tab" href="Inbox.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"></path></svg>Hộp thư</a>
    <a class="tab" href="Customers.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"></path></svg>Khách</a>
    <a class="tab" href="Tasks.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>Việc</a>
    <a class="tab" href="All.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>Tất cả</a>
  </nav>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <button aria-label="Đóng" onClick="{{toggleSheet}}" style="position:absolute;inset:0;border:0;padding:0;background:rgba(11,26,51,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:3;animation:fade .25s ease both;cursor:default"></button>
    <div style="position:absolute;left:0;right:0;bottom:84px;z-index:3;background:#fff;border-radius:12px 12px 0 0;padding:8px 16px 16px;box-shadow:0 -8px 30px rgba(11,26,51,.12);animation:sheet .38s cubic-bezier(.2,.9,.25,1) both">
      <div style="width:36px;height:4px;border-radius:2px;background:#C9D2DE;margin:0 auto 12px"></div>
      <div class="lbl" style="margin-bottom:10px">Tạo nhanh</div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
        <sc-for list="{{acts}}" as="a" hint-placeholder-count="8">
          <button class="act" style="animation-delay:{{a.delay}}"><span class="ai"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.d}}"></path></svg></span>{{a.l}}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { period: 1, scrub: null, sheet: false, done: {} }; }
chart() {
const s = this.state, W = 334, H = 112;
const P = [
{ cap: 'Doanh thu tuần này', n: 7, cur: [128, 284, 402, 610, 742], prev: [96, 230, 371, 512, 660, 780, 812], target: 900, unit: 'tr', labs: ['T2','T3','T4','T5','T6','T7','CN'], ticks: ['T2','T4','T6','CN'], prevName: 'tuần trước' },
{ cap: 'Doanh thu tháng 10', n: 31, cur: [92, 210, 318, 455, 588, 702, 880, 1010, 1180], prev: [80,170,260,340,450,540,610,720,820,900,1010,1100,1180,1290,1390,1460,1550,1660,1760,1820,1930,2010,2120,2210,2300,2380,2450,2530,2610,2680], target: 3500, unit: 'tr', labs: Array.from({ length: 31 }, (_, i) => (i + 1) + '/10'), ticks: ['1/10','10/10','20/10','31/10'], prevName: 'tháng 9' },
{ cap: 'Doanh thu năm 2026', n: 12, cur: [2.1, 4.3, 6.9, 9.2, 11.8, 14.6, 17.1, 19.9, 22.5, 23.7], prev: [1.8, 3.7, 5.9, 8.0, 10.2, 12.3, 14.9, 17.2, 19.5, 21.9, 24.6, 27.8], target: 32, unit: ' tỷ', labs: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'], ticks: ['T1','T4','T8','T12'], prevName: '2025' }
][s.period];
const max = Math.max(P.target, ...P.prev, ...P.cur) * 1.08;
const X = i => P.n === 1 ? 0 : i / (P.n - 1) * W, Y = v => H - v / max * H;
const pts = a => a.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1));
const f = v => P.unit === 'tr' ? (v >= 1000 ? (v / 1000).toFixed(2).replace('.', ',') + ' tỷ' : Math.round(v) + 'tr') : v.toFixed(1).replace('.', ',') + ' tỷ';
const k = P.cur.length - 1, last = P.cur[k], pv = P.prev[k];
const rate = last / (k + 1), projEnd = rate * P.n, d = Math.round((last / pv - 1) * 100);
const line = 'M' + pts(P.cur).join(' L');
const rv = { cap: P.cap, big: f(last), delta: (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d) + '%', dC: d >= 0 ? '#075E59' : '#B42318', dBg: d >= 0 ? '#E6F3F2' : '#FDE8E8',
  sub: 'So với ' + P.prevName + ' cùng kỳ ' + f(pv) + ' · dự kiến ' + f(projEnd),
  line, area: line + ' L' + X(k).toFixed(1) + ',' + H + ' L0,' + H + ' Z', prev: 'M' + pts(P.prev).join(' L'),
  proj: 'M' + X(k).toFixed(1) + ',' + Y(last).toFixed(1) + ' L' + X(P.n - 1).toFixed(1) + ',' + Y(projEnd).toFixed(1),
  ex: X(k).toFixed(1), ey: Y(last).toFixed(1), ty: Y(P.target).toFixed(1), tyT: (Y(P.target) - 4).toFixed(1), target: f(P.target),
  pct: Math.round(last / P.target * 100) + '%', ticks: P.ticks };
const sc = s.scrub == null ? { on: false } : (() => { const i = Math.min(P.n - 1, Math.max(0, Math.round(s.scrub * (P.n - 1)))); const has = i <= k; const v = has ? P.cur[i] : null;
  return { on: true, x: X(i).toFixed(1), y: (has ? Y(v) : Y(P.prev[i] || 0)).toFixed(1), tl: Math.min(290, Math.max(44, X(i))) + 'px', l: P.labs[i], v: has ? f(v) : 'Chưa tới', p: P.prev[i] != null ? f(P.prev[i]) : '—' }; })();
return { rv, sc,
  scrub: e => { const r = e.currentTarget.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width; if (navigator.vibrate && this.state.scrub == null) navigator.vibrate(5); this.setState({ scrub: Math.min(1, Math.max(0, x)) }); },
  unscrub: () => this.setState({ scrub: null }) };
}
sec(k) {
const shut = !!(this.state.shut || {})[k];
return { open: shut ? 'false' : 'true', label: shut ? 'Mở rộng' : 'Thu gọn', h: shut ? '0px' : '400px', o: shut ? 0 : 1,
  rot: shut ? 'rotate(-90deg)' : 'none', toggle: () => this.setState({ shut: { ...(this.state.shut || {}), [k]: !shut } }) };
}
renderVals() {
const s = this.state, g = '#56637A', b = '1px solid #EEF1F5';
