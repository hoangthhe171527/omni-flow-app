<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tất cả tính năng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A7D76}a:hover{color:#075E59}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tile{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
button,a{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.94)}
.bar{background:rgba(245,247,250,.8);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.ib{width:36px;height:36px;border-radius:6px;border:1px solid #E3E8EF;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:#0B1A33;position:relative;text-decoration:none;flex-shrink:0}
.search{height:36px;border-radius:6px;border:1px solid #E3E8EF;background:#fff;display:flex;align-items:center;gap:6px;padding:0 9px;box-sizing:border-box;cursor:text}
.search input{border:0;outline:0;background:transparent;font:400 14px 'Be Vietnam Pro',sans-serif;color:#0B1A33;min-width:0;flex-grow:1}
.sec{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#56637A;padding:0 4px 8px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#fff;border:1px solid #E3E8EF;border-radius:8px;padding:8px 4px}
.ft{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:8px;text-decoration:none;color:#0B1A33;font-size:11px;font-weight:500;text-align:center;line-height:1.25;position:relative}
.ft:hover{background:#F5F7FA}
.ti{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:4px;right:12px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#DC2626;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#56637A;text-decoration:none;padding-top:9px;position:relative}
.tab.on{color:#0A7D76}
.tab.on::before{content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:#0A7D76}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0B1A33;background:#F5F7FA;font-size:14px">
  <header class="bar" style="position:absolute;top:0;left:0;right:0;z-index:2;padding:52px 16px 10px;border-bottom:1px solid rgba(11,26,51,.06);display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="display:flex;align-items:center;gap:8px;flex-shrink:0"><svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><rect x="1.5" y="1.5" width="97" height="97" rx="23" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="3"></rect><path d="M12.5 58.2 A40 11 -20 0 1 87.5 29.8" fill="none" stroke="#0A7D76" stroke-width="6" stroke-linecap="round"></path><circle cx="49" cy="45" r="21" fill="#FFFFFF" stroke="#0A7D76" stroke-width="6"></circle><path d="M37 62 L33.5 75 L46 66.5" fill="none" stroke="#0A7D76" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12.5 58.2 A40 11 -20 0 0 87.5 29.8" fill="none" stroke="#0A7D76" stroke-width="6" stroke-linecap="round"></path><circle cx="73" cy="26" r="7" fill="#FFC43D" stroke="#FFFFFF" stroke-width="3"></circle></svg><span style="font-size:19px;font-weight:700;letter-spacing:-.4px">Vi<span style="color:#0A7D76">omni</span></span></span>
      <span style="flex-grow:1"></span>
      <a class="ib" href="Notifications.dc.html" aria-label="Thông báo, 3 mới"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:4px;background:#E5484D"></span></a>
      <a href="Me.dc.html" aria-label="Tài khoản" style="width:36px;height:36px;border-radius:6px;background:#0B1A33;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;text-decoration:none;flex-shrink:0">HT</a>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56637A" stroke-width="2" stroke-linecap="round" style="flex-shrink:0"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input aria-label="Tìm tính năng" placeholder="Tìm tính năng…" value="{{q}}" onInput="{{type}}">
    </label>
  </header>

  <main style="position:absolute;top:146px;left:0;right:0;bottom:84px;padding:14px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{g.delay}}">
        <div class="sec">{{g.l}}</div>
        <div class="grid">
          <sc-for list="{{g.items}}" as="f" hint-placeholder-count="4">
            <a class="ft" href="{{f.href}}" style="animation:tile .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{f.delay}}">
              <span class="ti" style="background:{{f.bg}};color:{{f.c}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.d}}"></path></svg></span>
              {{f.l}}
              <sc-if value="{{f.badge}}" hint-placeholder-val="{{false}}"><span class="badge">{{f.badge}}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="text-align:center;color:#56637A;padding:40px 0">Không tìm thấy tính năng “{{q}}”</div></sc-if>
  </main>

  <nav class="bar" style="position:absolute;left:0;right:0;bottom:0;height:84px;border-top:1px solid rgba(11,26,51,.07);display:flex;align-items:flex-start;padding:0 6px;z-index:4">
    <a class="tab" href="Main.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Tổng quan</a>
    <a class="tab" href="Inbox.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"></path></svg>Hộp thư</a>
    <a class="tab" href="Customers.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"></path></svg>Khách</a>
    <a class="tab" href="Tasks.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>Việc</a>
    <a class="tab on" href="All.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>Tất cả</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { q: '' }; }
renderVals() {
const s = this.state;
const T = ['#E6F3F2', '#075E59'], B = ['#E3EAFD', '#1D4ED8'], O = ['#FDECE3', '#9A3412'], V = ['#EFE7FD', '#5B21B6'], N = ['#EEF1F5', '#0B1A33'];
const G = [
['Bán hàng', [
['Cơ hội', 'M3 17l6-6 4 4 8-8M15 7h6v6', O, 'Customers.dc.html'],
['Báo giá', 'M6 3h9l4 4v14H6zM9 12h7M9 16h7', O, '#'],
['Kênh kết nối', 'M4 5h16v11H8l-4 4z', T, '#', 1],
['Thông báo', 'M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0', T, 'Notifications.dc.html', 3]
]],
['Công việc', [
['Dự án', 'M4 4h16v16H4zM4 9h16M9 9v11', B, 'Tasks.dc.html'],

['Đội & quản trị', [

['Danh bạ nội bộ', 'M5 3h12a2 2 0 0 1 2 2v16H5zM9 10a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0M7.5 17c.6-1.8 2.2-2.8 4-2.8s3.4 1 4 2.8', V, '#'],
['Quyền', 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z', V, '#'],

]],
['Cá nhân', [
['Tài khoản', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 21c1-4 4-6 8-6s7 2 8 6', N, 'Me.dc.html'],
['Cài đặt thông báo', 'M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0', N, '#'],

];
const q = s.q.trim().toLowerCase();
let k = 0;
const groups = G.map((g, gi) => ({ l: g[0], delay: (gi * 0.05) + 's', items: g[1].filter(f => !q || f[0].toLowerCase().includes(q)).map(f => ({ l: f[0], d: f[1], bg: f[2][0], c: f[2][1], href: f[3], badge: f[4] || false, delay: (0.05 + 0.02 * (k++)) + 's' })) })).filter(g => g.items.length);
return { groups, empty: groups.length === 0, q: s.q, type: e => this.setState({ q: e.target.value }) };
}
}
</script>
</body>
</html>
