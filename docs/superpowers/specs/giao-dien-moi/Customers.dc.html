<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

const ST = [['Mới', '#2563EB'], ['Báo giá', '#E8890C'], ['Thương lượng', '#7C3AED'], ['Chốt', '#0A7D76']];
const D = [

care, book, az: ['A','B','C','D','H','L','M','N','P','S','T','V','#'],
funnel, total: fmt(list.reduce((a, d) => a + d[1], 0)),
listLabel: s.stage ? ST[s.stage - 1][0] + ' · ' + list.length : 'Tất cả · ' + list.length,
clearOp: s.stage ? 1 : 0, clear: () => this.setState({ stage: 0 }),
deals: list.map((d, i) => { const g = ST[d[2] - 1]; return { n: d[0], v: fmt(d[1]), s: g[0], c: g[1], cust: d[3], due: d[4], dueC: d[5] ? '#C2410C' : '#56637A',
  p: d[6] + '%', dash: (C2 * d[6] / 100).toFixed(1) + ' ' + C2.toFixed(1), delay: (i * 0.04) + 's' }; })
};
}
}
