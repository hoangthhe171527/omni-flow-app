<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>App – sắp xếp nhóm việc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.row{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 4px 0 6px;background:#fff;border-top:1px solid #eef1f5;transition:background .15s,box-shadow .15s}
.row.lifted{box-shadow:0 10px 26px rgba(11,26,51,.18);position:relative;z-index:2;border-radius:8px;border-top-color:transparent}
.grip{width:44px;height:44px;border:0;background:transparent;color:#8592a6;display:flex;align-items:center;justify-content:center;cursor:grab;padding:0;touch-action:none}
.ib{width:44px;height:44px;border:0;background:transparent;color:#56637a;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;border-radius:6px}
.ib:disabled{opacity:.3}
.tag{font-size:12px;font-weight:600;padding:2px 6px;border-radius:4px;background:#fff4d6;color:#7a4f00}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0b1a33;background:#F5F7FA;font-size:14px">
  <header style="padding:46px 4px 6px;background:rgba(245,247,250,.92);border-bottom:1px solid rgba(11,26,51,.06);display:flex;align-items:center">
    <button class="ib" aria-label="Quay lại" style="color:#0b1a33"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></button>
    <span style="flex-grow:1;font-weight:600;font-size:16px">Sắp xếp nhóm việc</span>
    <button style="min-height:44px;padding:0 12px;border:0;background:transparent;font:600 15px 'Be Vietnam Pro',sans-serif;color:{{saveC}};cursor:pointer" disabled="{{clean}}">Lưu</button>
  </header>
  <p style="margin:12px 16px 8px;font-size:13px;color:#56637a;line-height:1.45">Giữ tay cầm ⋮⋮ rồi kéo lên/xuống, hoặc dùng mũi tên. Thứ tự này là thứ tự cột trên bảng.</p>
  <div style="margin:0 16px;background:#fff;border:1px solid #e3e8ef;border-radius:8px;overflow:hidden" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerLeave="{{up}}">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div class="{{r.cls}}">
        <button class="grip" aria-label="Kéo để đổi chỗ {{r.n}}" onPointerDown="{{r.down}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></button>
        <span style="flex-grow:1;min-width:0"><span style="display:block;font-weight:500">{{r.n}}</span><span style="font-size:12px;color:#56637a">{{r.count}} việc</span></span>
        <sc-if value="{{r.qc}}" hint-placeholder-val="{{false}}"><span class="tag">QC</span></sc-if>
        <button class="ib" aria-label="Lên trên" disabled="{{r.first}}" onClick="{{r.upBtn}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"></path></svg></button>
        <button class="ib" aria-label="Xuống dưới" disabled="{{r.last}}" onClick="{{r.downBtn}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
    </sc-for>
  </div>
  <p style="margin:12px 16px;font-size:12px;color:#56637a;line-height:1.45">Chỉ chủ hoặc quản lý kế hoạch thấy màn này. Đổi tên, xoá, gắn cờ QC vẫn ở menu ⋯ của từng cột.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.orig = ['Khách khác', 'Thiện Pianno', 'Đặng Hoài Bảo', 'Tường Nhật', 'Hoàn thiện', 'Bàn giao']; this.state = { order: this.orig.slice(), drag: null }; this.C = { 'Khách khác': 2, 'Thiện Pianno': 1, 'Đặng Hoài Bảo': 1, 'Tường Nhật': 2, 'Hoàn thiện': 0, 'Bàn giao': 0 }; }
swap(i, j) { const o = this.state.order.slice(); if (j < 0 || j >= o.length) return; const [x] = o.splice(i, 1); o.splice(j, 0, x); this.setState({ order: o }); return o; }
renderVals() {
  const s = this.state;
  return {
    clean: s.order.join() === this.orig.join(), saveC: s.order.join() === this.orig.join() ? '#9AA5B8' : '#0a7d76',
    move: e => { if (s.drag == null) return; const dy = e.clientY - this.y0; const steps = Math.trunc(dy / 56); if (steps !== 0) { const ni = Math.max(0, Math.min(s.order.length - 1, s.drag + steps)); if (ni !== s.drag) { this.swap(s.drag, ni); this.y0 += (ni - s.drag) * 56; this.setState({ drag: ni }); } } },
    up: () => { if (s.drag != null) this.setState({ drag: null }); },
    rows: s.order.map((n, i) => ({ n, count: this.C[n], qc: n === 'Hoàn thiện', first: i === 0, last: i === s.order.length - 1, cls: 'row' + (s.drag === i ? ' lifted' : ''),
      down: e => { e.preventDefault(); this.y0 = e.clientY; this.setState({ drag: i }); },
      upBtn: () => this.swap(i, i - 1), downBtn: () => this.swap(i, i + 1) }))
  };
}
}
</script>
</body>
</html>
