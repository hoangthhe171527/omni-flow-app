<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>App – giữ thẻ để kéo sang nhóm khác</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes lift{from{transform:scale(1)}to{transform:scale(1.04) rotate(-1.5deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bar{background:rgba(20,44,58,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.col{width:300px;flex-shrink:0;background:#eef1f5;border-radius:8px;padding:0 8px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s}
.col.target{box-shadow:inset 0 0 0 2px #0a7d76;background:#e6f3f2}
.card{background:#fff;border-radius:8px;padding:10px 12px;box-shadow:0 1px 2px rgba(11,26,51,.08);font-size:14px;color:#0b1a33;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .15s}
.card.ghosted{opacity:.3}
.slot{height:64px;border-radius:8px;border:2px dashed #0a7d76;background:rgba(10,125,118,.06)}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#24485A" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerLeave="{{up}}">
  <header class="bar" style="position:absolute;top:0;left:0;right:0;z-index:3;padding:46px 12px 10px;color:#fff">
    <div style="font-weight:600;font-size:16px">Tân trang đàn cơ</div>
    <div style="font-size:12px;opacity:.82">Lê Nguyên Team · 7 việc</div>
  </header>
  <div style="position:absolute;top:104px;left:0;right:0;bottom:0;overflow:hidden">
    <div style="display:flex;gap:10px;padding:12px 16px;transform:translateX({{trackX}});transition:transform .35s cubic-bezier(.2,.8,.2,1)">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
        <section class="{{c.cls}}" aria-label="{{c.n}}">
          <div style="display:flex;align-items:center;gap:8px;min-height:44px;padding-left:4px"><span style="font-weight:600;flex-grow:1">{{c.n}}</span><span style="font-size:12px;font-weight:600;min-width:20px;height:20px;border-radius:10px;background:#fff;color:#56637a;display:flex;align-items:center;justify-content:center">{{c.count}}</span></div>
          <sc-for list="{{c.cards}}" as="t" hint-placeholder-count="2">
            <div class="{{t.cls}}" onPointerDown="{{t.down}}"><div style="font-weight:500;line-height:1.35">{{t.title}}</div><div style="font-size:12px;color:#56637a;margin-top:6px">{{t.due}}</div></div>
          </sc-for>
          <sc-if value="{{c.slot}}" hint-placeholder-val="{{false}}"><div class="slot" aria-hidden="true"></div></sc-if>
        </section>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{lifted}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:0;right:0;top:104px;z-index:4;display:flex;justify-content:space-between;pointer-events:none;animation:fade .2s both">
      <span style="width:28px;height:600px;background:linear-gradient(90deg,rgba(10,125,118,.35),transparent);opacity:{{edgeL}}"></span>
      <span style="width:28px;height:600px;background:linear-gradient(270deg,rgba(10,125,118,.35),transparent);opacity:{{edgeR}}"></span>
    </div>
    <div class="card" style="position:absolute;z-index:5;width:268px;left:{{gx}};top:{{gy}};box-shadow:0 18px 40px rgba(11,26,51,.35);animation:lift .18s both;pointer-events:none"><div style="font-weight:500;line-height:1.35">{{liftTitle}}</div><div style="font-size:12px;color:#56637a;margin-top:6px">Thả vào “{{targetName}}”</div></div>
  </sc-if>
  <div style="position:absolute;left:16px;right:16px;bottom:30px;z-index:3;background:rgba(255,255,255,.95);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#3a4760;line-height:1.45">{{hint}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { cols: [['Khách khác', ['t1', 't2']], ['Thiện Pianno', ['t3']], ['Đặng Hoài Bảo', ['t4']], ['Tường Nhật', ['t6', 't7']]], view: 0, lift: null, x: 0, y: 0, hint: 'Giữ một thẻ khoảng nửa giây để nhấc lên, kéo sang trái/phải. Tới mép màn hình thì bảng tự trượt sang nhóm bên cạnh.' };
  this.T = { t1: ['YAMAHA U1E 1174957', 'Hạn 31/10'], t2: ['KAWAI BL61 – lên dây', 'Hạn 20/10'], t3: ['Thay búa U3H', 'Hạn 18/10'], t4: ['YAMAHA U3E 592698', 'Hạn 31/10'], t6: ['KAWAI BL61 K578504', 'Trễ 32 ngày'], t7: ['KAWAI BL61 (b)', 'Trễ 32 ngày'] }; }
componentWillUnmount() { clearTimeout(this.lp); clearInterval(this.edge); }
target() { const s = this.state; return Math.max(0, Math.min(s.cols.length - 1, s.view + (s.x > 326 ? 1 : 0))); }
renderVals() {
  const s = this.state, L = s.lift, tgt = L ? this.target() : -1;
  const rootXY = e => { const r = e.currentTarget.closest('[style*="844px"]').getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  return {
    trackX: (-s.view * 310) + 'px', lifted: !!L, liftTitle: L ? this.T[L.id][0] : '', targetName: L ? s.cols[tgt][0] : '',
    gx: (s.x - 134) + 'px', gy: (s.y - 30) + 'px', edgeL: L && s.x < 40 ? '1' : '0', edgeR: L && s.x > 350 ? '1' : '0', hint: s.hint,
    move: e => { if (!this.lp && !L) return; const r = e.currentTarget.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
      if (!L) { if (Math.abs(x - this.sx) > 8 || Math.abs(y - this.sy) > 8) { clearTimeout(this.lp); this.lp = null; } return; }
      this.setState({ x, y });
      clearInterval(this.edge); this.edge = null;
      if (x > 350 || x < 40) { this.edge = setInterval(() => { const st = this.state; const nv = st.x > 350 ? Math.min(st.cols.length - 1, st.view + 1) : Math.max(0, st.view - 1); if (nv !== st.view) this.setState({ view: nv }); }, 700); } },
    up: () => { clearTimeout(this.lp); this.lp = null; clearInterval(this.edge); this.edge = null; if (!L) return;
      const t = this.target(); const cols = s.cols.map(c => [c[0], c[1].filter(id => id !== L.id)]); cols[t][1].push(L.id);
      this.setState({ cols, lift: null, hint: t === L.from ? 'Thả lại nhóm cũ — không thay đổi.' : 'Đã chuyển “' + this.T[L.id][0] + '” sang “' + cols[t][0] + '”.' }); },
    cols: s.cols.map((c, ci) => ({ n: c[0], count: c[1].length, cls: 'col' + (ci === tgt ? ' target' : ''), slot: ci === tgt && L && L.from !== ci,
      cards: c[1].map(id => ({ title: this.T[id][0], due: this.T[id][1], cls: 'card' + (L && L.id === id ? ' ghosted' : ''),
        down: e => { const r = e.currentTarget.closest('[style*="844px"]').getBoundingClientRect(); this.sx = e.clientX - r.left; this.sy = e.clientY - r.top; clearTimeout(this.lp);
          this.lp = setTimeout(() => { this.lp = null; if (navigator.vibrate) navigator.vibrate(10); this.setState({ lift: { id, from: ci }, x: this.sx, y: this.sy, hint: 'Đang kéo — thả vào nhóm có viền xanh.' }); }, 400); } })) }))
  };
}
}
</script>
</body>
</html>
