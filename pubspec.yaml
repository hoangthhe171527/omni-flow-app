name: omni_app
description: "OmniCRM — omnichannel inbox and CRM for mobile."
publish_to: 'none'
version: 0.1.0+16

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.0
  # Message photos need a persistent disk cache. Image.network only keeps an
  # in-memory decode cache, so revisiting a thread re-downloads platform CDN
  # originals and exposes every intermittent Zalo CDN timeout again.
  cached_network_image: ^3.4.1
  video_player: ^2.9.5

  # Navigation
  go_router: ^14.2.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Media / external actions
  image_picker: ^1.0.7
  url_launcher: ^6.3.0
  # Lưu ảnh QR vào thư viện để quét lại bằng Zalo trên chính máy đó.
  gal: ^2.3.0
  # Android system push: FCM wakes a background/killed app; local notifications
  # render the same alert while the inbox is open in the foreground.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^18.0.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
