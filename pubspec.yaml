name: omni_app
description: "Viomni — omnichannel inbox and CRM for mobile."
publish_to: 'none'
version: 0.1.5+28

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.0
  # Message photos need a persistent disk cache. Image.network only keeps an
  # in-memory decode cache, so revisiting a thread re-downloads platform CDN
  # originals and exposes every intermittent Zalo CDN timeout again.
  cached_network_image: ^3.4.1
  video_player: ^2.9.5

  # Navigation
  go_router: ^14.2.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Environment
  flutter_dotenv: ^5.1.0
  google_sign_in: ^7.2.0

  # Media / external actions
  image_picker: ^1.0.7
  url_launcher: ^6.3.0
  # Lưu ảnh QR vào thư viện để quét lại bằng Zalo trên chính máy đó.
  gal: ^2.3.0
  # Android system push: FCM wakes a background/killed app; local notifications
  # render the same alert while the inbox is open in the foreground.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^18.0.1
  # Crash reporting. Nothing recorded field failures before this, so a crash on
  # a rep's phone reached us only when they thought to describe it. Firebase is
  # already a dependency for push, so this adds a report sink rather than a
  # vendor.
  firebase_crashlytics: ^5.3.0
  # Realtime over Laravel Reverb, which speaks the Pusher protocol. The protocol
  # subset we need is small and implemented in core/realtime/, rather than taken
  # from pusher_channels_flutter — that package only reaches Pusher's own cloud
  # and cannot be pointed at a self-hosted Reverb. A raw socket also means no
  # native plugin to configure per platform, and a client that is unit-testable
  # against a fake socket.
  web_socket_channel: ^3.0.3
  # Hộp thư: gửi tài liệu (PDF, Office, CSV…). Android dùng Storage Access
  # Framework (không quyền bộ nhớ); iOS chỉ bật trình chọn tài liệu — xem
  # ios/Podfile (PICKER_MEDIA/PICKER_AUDIO = false).
  file_picker: ^11.0.3
  record: ^7.1.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - .env
    # Giấy phép của font, hiện trong trang "Giấy phép" của app (xem bootstrap).
    - assets/fonts/BeVietnamPro-OFL.txt

  # Be Vietnam Pro — font giao diện duy nhất, đóng gói các độ đậm 400-800
  # (không tải lúc chạy: xưởng hay mất sóng, chữ không được nháy khi mở app).
  # Tải từ github.com/google/fonts (ofl/bevietnampro), giấy phép SIL OFL 1.1:
  # assets/fonts/BeVietnamPro-OFL.txt.
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
